he agent more autonomy degrades the attention you bring to the next run. The trust is deserved. The watching still has to be engineered. So when the next run lands clean, ask the plain question first: when did you last do this kind of work by hand?"}, {"id": "unsure-a90c9ec2-62", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "lectures/the-whole-map.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Every move hangs on a location\n\n- One place for every move to hang. Each technique in this training has a location on this cycle, not just a slot in the schedule. Material with a location is material you can find again later.\n- You do the moves first and name them after. The map is a place to hang moves, not a lecture. No law gets taught here; each one gets named at the moment you have already used it and can recognize it as yours.\n- Every module points back to this map. The question is always the same: which phase is this move in, and what does that phase govern?", "b": "## Every move hangs on a location\n\n- One place for every move to hang. Each technique in this training has a location on this cycle, not just a slot in the schedule. Material with a location is material you can find again later.\n- You do the moves first and name them after. The map is a container, not a lecture. No law gets taught here; each one gets named at the moment you have already used it and can recognize it as yours.\n- Every module points back to this map. The question is always the same: which phase is this move in, and what does that phase govern?"}, {"id": "unsure-a90c9ec2-66", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agentic-engineering-101/learn-from-the-test.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Set up the Module 5 worktree\n\nBefore opening the Module 5 session, fork the Module 4 starting SHA into a sibling worktree. Module 5's work (diagnosis, verifier, reference, plan.md, and the re-send) runs in the worktree, so the second run starts from the same code state as the first. Cherny's parallel-worktrees unlock from the Module 2 pre-read lands here.\n\nA real engineering call lives in this fork: gitignored files (your `CLAUDE.local.md`, `observations/`) don't ride into a worktree because git doesn't see them. AE101's default is to copy them in once at fork time. Your Module 1 evidence rides forward (along with any Module 3 artefacts if you've completed it); Module 5 and Module 6 compounding diverges in the worktree; you decide post-Module-6 what to merge back into the original. Other engineers wire it differently.\n\n**Session** *(continue or new, \"original repo\")*\n\nRun the fork from your original repo, not the worktree (it doesn't exist yet). If your Module 4 session is still open, ask it there, it's already in the right place. Otherwise open a fresh session in the original repo location and ask there.\n\n**Claude figures out `<repo-name>` from the working directory.** Help it if it gets confused.\n\n{{prompt:ae101-m5-worktree-setup}}\n\n**Claude will narrate before acting.** It usually opens with a plan summary listing the six sub-steps, then runs them. Skim past the opening; look for the shell-command output confirming the worktree path and which files copied across.\n\n**The coordinates are the anchor.** Claude should read the protected `Run coordinates` block in `task.md`, use the exact `m4/<slug>` branch named there, and fork from that branch's \"M4 starting point\" commit. If the coordinates are missing or the commit message has been rewritten, stop and use the SHA Claude reported at Module 4 close rather than guessing from branch names.\n\nThe worktree is forked and ready. You open the session in it at the first exercise.", "b": "## Set up the Module 5 worktree\n\nBefore opening the Module 5 session, fork the Module 4 starting SHA into a sibling worktree. Module 5's work (diagnosis, verifier, reference, plan.md, and the re-send) runs in the worktree, so the second run starts from the same code state as the first. Cherny calls parallel worktrees his biggest productivity unlock; the Module 2 pre-read lands here.\n\nA real engineering call lives in this fork: gitignored files (your `CLAUDE.local.md`, `observations/`) don't ride into a worktree because git doesn't see them. AE101's default is to copy them in once at fork time. Your Module 1 evidence rides forward (along with any Module 3 artefacts if you've completed it); Module 5 and Module 6 compounding diverges in the worktree; you decide post-Module-6 what to merge back into the original. Other engineers wire it differently.\n\n**Session** *(continue or new, \"original repo\")*\n\nRun the fork from your original repo, not the worktree (it doesn't exist yet). If your Module 4 session is still open, ask it there, it's already in the right place. Otherwise open a fresh session in the original repo location and ask there.\n\n**Claude figures out `<repo-name>` from the working directory.** Help it if it gets confused.\n\n{{prompt:ae101-m5-worktree-setup}}\n\n**Claude will narrate before acting.** It usually opens with a plan summary listing the six sub-steps, then runs them. Skim past the opening; look for the shell-command output confirming the worktree path and which files copied across.\n\n**The coordinates are the anchor.** Claude should read the protected `Run coordinates` block in `task.md`, use the exact `m4/<slug>` branch named there, and fork from that branch's \"M4 starting point\" commit. If the coordinates are missing or the commit message has been rewritten, stop and use the SHA Claude reported at Module 4 close rather than guessing from branch names.\n\nThe worktree is forked and ready. You open the session in it at the first exercise."}, {"id": "unsure-a90c9ec2-69", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agentic-engineering-101/plan-mode-done-right.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Key Concepts\n- Structure is persuasive. A 7-item plan with headers looks like a decision even when it's a draft. **Remember: at least 10% wrong.**\n- One kind of scrutiny catches one kind of miss; a human read and an agent's walk-down of unresolved branches catch different things, and the gap between them is where the plan-reading skill lives\n- Assumption-silent isn't assumption-free. Every plan assumes something, and the good ones say what. **Remember: push-backs ship into memory.**\n- A plan with a specific file list has made decisions; a plan without one hasn't\n- Verification steps that could actually fail are gates; verification steps that always pass are decoration\n- You don't have to execute a plan to know it's good. Making it good IS the work.\n- Plan mode makes the read possible; it isn't the read", "b": "## Key Concepts\n- Structure is persuasive. A 7-item plan with headers looks like a decision even when it's a draft. At least 10% wrong.\n- One kind of scrutiny catches one kind of miss; a human read and an agent's walk-down of unresolved branches catch different things, and the gap between them is where the plan-reading skill lives\n- Assumption-silent isn't assumption-free. Every plan assumes something, and the good ones say what. Push-backs ship into memory.\n- A plan with a specific file list has made decisions; a plan without one hasn't\n- Verification steps that could actually fail are gates; verification steps that always pass are decoration\n- You don't have to execute a plan to know it's good. Making it good IS the work.\n- Plan mode makes the read possible; it isn't the read\n\n## Homework\nRead the conventions your tracker already encodes: [Read the rules hiding in a ticket](exercises/read-the-ticket-rules.md). Paste one real ticket, let Claude infer how your team uses the fields, and fold a few of those rules into the task-shaping file you saved here."}, {"id": "unsure-7057500e-77", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "exercises/threat-model-with-stride.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Phase 3: Write the decision as an ADR\n\n*5 min*\n\n- The ADR states the call, its alternatives, and the constraint that picked the winner. You write it in your repo's convention. It reads like one engineer explaining a call to another, not a compliance checkbox.\n- Have the agent draft it and show it before saving. You read the call before it lands on disk.\n\nAsk Claude to draft the ADR in your repo's convention and show it before saving.\n\n{{prompt:threat-model-with-stride-3}}", "b": "## Phase 3: Write the decision as an ADR\n\n*5 min*\n\n- The ADR states the call, its alternatives, and the constraint that picked the winner. You write it in your repo's convention. It reads like one engineer explaining a call to another, not a compliance checkbox. It is the artifact your CISO would actually read.\n- Have the agent draft it and show it before saving. You read the call before it lands on disk.\n\nAsk Claude to draft the ADR in your repo's convention and show it before saving.\n\n{{prompt:threat-model-with-stride-3}}"}, {"id": "unsure-8fa40902-101", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "lectures/how-this-training-was-built.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Thirty bullets were not the training\n\nAt first, this training was a strategy document: seven headings and thirty bulletpoints. It looked complete in the way a good list can look complete. Then the bulletpoints became module prototypes, and the gaps became visible.\n\nThe failures were specific. A phrase brought consultancy voice into an engineering lecture. An exercise asked an experienced engineer to perform a scripted reaction. A module tried to feel tidy where the student should have felt uncertainty. Each correction became a reusable rule. One now says *“Forcing functions stay, scripted reactions go.”* Another requires every Claude Code capability claim to be checked before each cohort.\n\nThe rules were corrected too. Some were too broad. Some fired in the wrong place. Each time a rule failed, the failure sharpened the rule instead of disappearing into one edit.\n\nThe system behind this training currently has 279 active rules and subrules across 12 checklists. The count is not a claim that more rules make better work. It shows how much specific judgment had to be written down before another session could reuse it.", "b": "## Everything starts as a few bulletpoints somewhere\n\nAt first, this training was a strategy document: seven headings and thirty bulletpoints. It looked complete in the way a good list can look complete. Then the bulletpoints became module prototypes, and the gaps became visible.\n\nThe failures were specific. A phrase brought consultancy voice into an engineering lecture. An exercise asked an experienced engineer to perform a scripted reaction. A module tried to feel tidy where the student should have felt uncertainty. Each correction became a reusable rule. One now says *“Forcing functions stay, scripted reactions go.”* Another requires every Claude Code capability claim to be checked before each cohort.\n\nThe rules were corrected too. Some were too broad. Some fired in the wrong place. Each time a rule failed, the failure sharpened the rule instead of disappearing into one edit.\n\nThe system behind this training currently has 279 active rules and subrules across 12 checklists. The count is not a claim that more rules make better work. It shows how much specific judgment had to be written down to reach control over the training's style."}, {"id": "unsure-03264fed-109", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "exercises/push-back-on-the-plan.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Phase 2: Enter plan mode and ask for the plan\n\n*15 min*\n\n- In plan mode, name the task, why it matters, and the one constraint you care about most.\n- Plan mode explores the codebase and drafts the steps; your job starts when it pauses for approval.\n\nDrop your task after the colon.\n\n{{prompt:push-back-on-the-plan-1}}\n\nPlan mode takes minutes on real codebases. Eight to twelve isn't unusual. Use the wait to chat with colleagues about what you're building.\n\n## Read for the decisions that matter\n\n- M1 named the countermove: never let the agent say everything, take the ranked list first.\n- A plan deserves more attention than ordinary agent output because approval hands it to generation. That does not make every line equally important.\n- Scan for the decisions most likely to change the work: files, design, assumptions, and verification. Push on the few that matter most.", "b": "## Phase 2: Ask for the plan\n\n*15 min*\n\n- In plan mode, name the task, why it matters, and the one constraint you care about most.\n- Plan mode explores the codebase and drafts the steps; your job starts when it pauses for approval.\n\nDrop your task after the colon.\n\n{{prompt:push-back-on-the-plan-1}}\n\nPlan mode takes minutes on real codebases. Eight to twelve isn't unusual. Use the wait to chat with colleagues about what you're building.\n\n## Read the right stuff first\n\n- M1 named the countermove: steer how the agent best communicates with you; here, take the ranked list first.\n- A plan deserves more attention than ordinary agent output because approval hands it to generation. That does not make every line equally important.\n- Scan for the decisions most likely to change the work: files, design, assumptions, and verification. The few that matter most are the ones you'll push the agent back on in the steps ahead."}, {"id": "unsure-2b5a60a5-115", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "lectures/the-loop-has-a-name.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Eval\n\n- The thing you built at M5 reads an agent's work and decides whether it meets a bar. The checks you just ranked against your dominant gap are the same family: some deterministic, some an LLM reading the work, some firing before the session even starts.\n- The name for all of it is **eval**: the automated check that says *this agent-produced thing meets our bar*.\n- Three names, one thing. *Judge* when the check is itself an LLM reading the work. *Verifier* when the check is deterministic: tests, lint, compile, a shell hook that returns true or false. *Gate* when the same check is placed in CI and a pull request can't merge without it.\n- On the map they are the checking loop the M2 drawing left dashed, now drawn solid.", "b": "## Eval\n\n- The thing you built at M5 reads an agent's work and decides whether it meets a bar. The checks you just ranked against your dominant gap are the same family: some deterministic, some an LLM reading the work, some firing before the session even starts.\n- The name for all of it is **eval**: the automated check that says *this agent-produced thing meets our bar*.\n- Three names, one thing. *Judge* when the check is itself an LLM reading the work. *Verifier* when the check is deterministic: tests, lint, compile, a shell hook that returns true or false. *Gate* when the same check is placed in CI and a pull request can't merge without it. M5 used *verifier* and *gate* for the whole family; from here each name is precise, so a background-agent verifier from M5 can be called a judge.\n- On the map they are the checking loop the M2 drawing left dashed, now drawn solid."}, {"id": "unsure-5711a601-129", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agentic-engineering-101/reference/multi-session-git.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Stashing, switching, and small recoveries between sessions\n\nSometimes one session's in-flight work needs to show up in another. A helper function you wrote in the bug-fix session is exactly what the feature session needs.\n\n`git stash` is how work moves between sessions. Stash in one, pop in the other. The changes ride the Git graph across worktrees because the graph is shared.\n\n```\ngit stash push -m \"helper fn for csv export\"\ncd ../repo-feature\ngit stash pop\n```\n\nClaude Code sessions keep their own conversational state. Git is what moves actual changes between them. Don't try to make one session \"tell\" the other what it did; commit, stash, or push a branch, and let Git carry the bits.\n\nAgent committed to the wrong branch in one session? Don't tie your brain in knots. `git reset --soft HEAD~1` keeps the changes staged, switch branches, re-commit on the right one. A thirty-second fix.", "b": "## Stashing and switching between sessions\n\nSometimes one session's in-flight work needs to show up in another. A helper function you wrote in the bug-fix session is exactly what the feature session needs.\n\n`git stash` is how work moves between sessions. Stash in one, pop in the other. The changes ride the Git graph across worktrees because the graph is shared.\n\n```\ngit stash push -m \"helper fn for csv export\"\ncd ../repo-feature\ngit stash pop\n```\n\nClaude Code sessions keep their own conversational state. Git is what moves actual changes between them. Don't try to make one session \"tell\" the other what it did; commit, stash, or push a branch, and let Git carry the bits.\n\nAgent committed to the wrong branch in one session? Don't tie your brain in knots. `git reset --soft HEAD~1` keeps the changes staged, switch branches, re-commit on the right one. A thirty-second fix."}, {"id": "unsure-488cf42a-11", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "lectures/reading-the-return.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Why these three, every session\n\n- The three are consequences, not bad luck. The LLM is a statistical machine with a finite window: it predicts what is likely, and it holds only so much. Run it long enough and all three failures follow, whoever wrote the prompt.\n- Predictable failures are readable failures. Because the three come from the machine, expect all three in any long session. That is why three lenses are enough to read whatever comes back.\n- One question per finding: which of the three is this? A finding counts when it carries a lens and a quoted moment from the artefact. Two modes tangled in one finding means the read is not done; pull them apart.", "b": "## Why these three, every session\n\n- The three are consequences, not bad luck. The LLM is a statistical machine with a finite window: it predicts what is likely, and it holds only so much. Run it long enough and all three failures follow, whoever wrote the prompt.\n- Predictable failures are readable failures. Because the three come from the machine, expect all three in any long session. That is why three lenses are enough to read whatever comes back.\n- Use the three as lenses, not boxes. Ground each finding in a quoted moment from the artefact; the same moment can reveal more than one failure mode."}, {"id": "unsure-ec113ea8-127", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "lectures/the-far-half.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Long-running work adds three new concerns\n\n- Long-running is not more of the same. So far you sat inside every loop: you read each reply, caught each wobble as it happened. When the agent runs for an hour without you watching, that quick feedback goes quiet.\n- **Verification** tells you whether the result is any good. Tests, checks, reads, judges: everything that pushes back on the work before you accept it. On a long session, this stops being a glance and becomes a job.\n- **Absorption** determines how much of the output you can actually take up. Generating is fast; reading, judging, and merging are not. On a long session the gap between the two decides your real throughput.\n- **Outcome** determines what survives the session. The fix you keep, the rule it taught you, and whether any of it crosses the wall from you to the team.\n\n## Your first un-packaged long session\n\n- One long session goes off un-packaged, on purpose. You watch what the agent does with the system you built, exactly as it stands. Nothing added for the occasion.\n- One question to carry into the session. When the agent takes a hundred steps alone, what makes you trust the result at the end?", "b": "## Long-running work adds three new concerns\n\n- Long-running is not more of the same. So far you sat inside every loop: you read each reply, caught each wobble as it happened. When the agent runs for an hour without you watching, that quick feedback goes quiet.\n- **Verification** tells you whether the result is any good. Tests, checks, reads, judges: everything that pushes back on the work before you accept it. On a long session, this stops being a glance and becomes a job.\n- **Absorption** determines how much of the output you can actually take up. Generating is fast; reading, judging, and merging are not. On a long session the gap between the two decides your real throughput.\n- **Outcome** determines what survives the session. The fix you keep, the rule it taught you, and whether any of it crosses the wall from you to the team.\n- One question to carry into the session: when the agent takes a hundred steps alone, what makes you trust the result at the end?"}, {"id": "unsure-35e7889b-139", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "lectures/when-a-plan-is-good.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Ask plan mode what changed\n\nYou press Shift+Tab until the status bar shows plan mode on. Then put the question to your own session:\n\n{{prompt:when-a-plan-is-good-1}}\n\n- Plan mode writes a thing you can read, edit, and push back on before your source changes. Nothing edits your source until you approve.", "b": "## Ask plan mode what changed\n\nYou press Shift+Tab until the status bar shows plan mode on. Then put the question to your own session:\n\n{{prompt:when-a-plan-is-good-1}}\n\n- Plan mode writes a thing you can read, edit, and push back on before your source changes."}, {"id": "unsure-d3c8363a-140", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "lectures/when-a-plan-is-good.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Ask plan mode what changed\n\nYou press Shift+Tab until the status bar shows plan mode on. Then put the question to your own session:\n\n{{prompt:when-a-plan-is-good-1}}\n\n- Plan mode writes a thing you can read, edit, and push back on before your source changes.", "b": "## Ask plan mode what changed\n\nYou press Shift+Tab until the status bar shows plan mode on. Then put the question to your own session:\n\n{{prompt:when-a-plan-is-good-1}}"}, {"id": "unsure-d14b467a-142", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "exercises/push-back-on-the-plan.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Phase 3: Push back twice\n\n*12 min*\n\n- At the approval prompt, pick **No, keep planning**. Send two push-backs on two different axes: one soft item, and one of (assumption · alternative). Your own words, your own concerns.\n- **Soft items:** the step that reads clean but skips over something. *\"Update the config\"* without which keys. The vagueness isn't a drafting slip; it's where the agent hasn't decided yet. Stuck picking one? Ask Claude which step it's least confident about. **The agent finds; you judge.**\n- **Assumptions:** something the plan is carrying silently that it shouldn't. A library version, a schema shape, a teammate's recent change the agent hasn't seen.\n- **Alternatives:** not just a flag; the change you'd make. Merge two steps that belong together. Reorder two steps whose sequence matters.\n\n> **Two messages, then move on.** Two push-backs on two axes, plus one check that the regeneration held: read the flagged steps in the revised plan, not the agent's report of them, and if the vagueness survived, push back again on that line. A third push-back may be forming. That is fine; it is the second-pass read's job to catch the rest.", "b": "## Phase 3: Push back twice\n\n*12 min*\n\n- At the approval prompt, pick **No, keep planning**; the other two options approve and leave plan mode. Send two push-backs on two different axes: one soft item, and one of (assumption · alternative). Your own words, your own concerns.\n- **Soft items:** the step that reads clean but skips over something. *\"Update the config\"* without which keys. The vagueness isn't a drafting slip; it's where the agent hasn't decided yet. Stuck picking one? Ask Claude which step it's least confident about. **The agent finds; you judge.**\n- **Assumptions:** something the plan is carrying silently that it shouldn't. A library version, a schema shape, a teammate's recent change the agent hasn't seen.\n- **Alternatives:** not just a flag; the change you'd make. Merge two steps that belong together. Reorder two steps whose sequence matters.\n\n> **Two messages, then move on.** Two push-backs on two axes, plus one check that the regeneration held: read the flagged steps in the revised plan, not the agent's report of them, and if the vagueness survived, push back again on that line. A third push-back may be forming. That is fine; it is the second-pass read's job to catch the rest."}, {"id": "unsure-a90c9ec2-54", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "exercises/map-the-access-surface.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## What this sets up\n\nThe STRIDE exercise invokes the curated STRIDE skill on the map you just built. The surface map IS the input. If you rushed Phase 2, STRIDE threat-models a thin map; if you worked the delta, STRIDE has something real to chew on.", "b": "## What this sets up\n\nThe STRIDE exercise invokes the curated STRIDE skill on the map you just built. The surface map IS the input. If you rushed Phase 2, STRIDE threat-models a thin map; if you sat with it, STRIDE has something real to chew on."}, {"id": "unsure-a8ac20ef-83", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agentic-engineering-101/plan-mode-done-right.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## What You'll Learn\nAfter this module, you will be able to:\n- **Run** plan mode on a real multi-file task and judge the plan against five criteria\n- **Push back** twice on the plan via *No, keep planning*, surfacing what the agent didn't see\n- **Walk down** unresolved branches, with a recommended answer per branch\n- **Pair** human read with agent walk-down: read → push-back → walk-down → approve\n- **Spot** approval inflation in a plan whose structure makes it look decided\n- **Extract** task-shaping rules from your session into a `.md` file, sharpening at least one before saving\n- **Name** three shapes for turning a rules file into automation: Slack triage, issue webhook, scheduled read", "b": "## What You'll Learn\nAfter this module, you will be able to:\n- **Run** plan mode on a real multi-file task and judge the plan against five criteria, naming the one it fails\n- **Push back** twice on the plan via *No, keep planning*, surfacing what the agent didn't see\n- **Walk down** unresolved branches, with a recommended answer per branch\n- **Pair** human read with agent walk-down: read → push-back → walk-down → approve\n- **Spot** approval inflation in your own past plans\n- **Extract** task-shaping rules from your session into a `.md` file, sharpening at least one before saving\n- **Name** three shapes for turning a rules file into automation: Slack triage, issue webhook, scheduled read"}, {"id": "unsure-c6847414-86", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "lectures/the-loop-has-a-name.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## The eval primitive scales unchanged\n\n- 19.2% of Intercom's pull requests merge with no human reviewer. Darragh Curran runs engineering there; the numbers are Intercom's own, published in his April post *\"2x, nine months later\"*. Auto-approved PRs merge in 14.6 minutes versus an org median of 75.8 minutes. 86% of them are 20 lines or fewer. The R&D org is around 470 people inside a 1,300-person company.\n- Read that as your verifier from M5, scaled. Same primitive, placed in CI, fed by convention, trusted by a human team that set the thresholds.\n- The shape doesn't change when the org gets big. Only the number of evals, the number of places they sit, and the number of engineers contributing to the kit.", "b": "## The eval primitive scales unchanged\n\n- 19.2% of Intercom's pull requests merge with no human reviewer. Darragh Curran runs engineering there; the numbers are Intercom's own, published in his April post *\"2x, nine months later\"*. Auto-approved PRs merge in 14.6 minutes versus an org median of 75.8 minutes. 86% of them are 20 lines or fewer. The R&D org is around 470 people inside a 1,300-person company.\n- Read that as your verifier from M5, scaled. Same primitive: an automated check that says *this meets the bar*, placed in CI, fed by convention, trusted by a human team that set the thresholds.\n- The shape doesn't change when the org gets big. Only the number of evals, the number of places they sit, and the number of engineers contributing to the kit."}, {"id": "unsure-2d8c60a5-90", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "exercises/orient-and-introspect.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Read your repo deliberately\n\n- You steer what Claude loads: the repo's shape, its structure, what's load-bearing, what's gone stale. A cold agent reads whatever it stumbles into; you point it.\n\n> **Big repo? The read can fan out.** If Claude starts reading dozens of files, interrupt with `Esc`, narrow to one feature or directory, and say `continue`. It can also stop short, and that one is harder to catch because a confident answer arrives either way. If the read names only the files you'd have guessed at, a `\"there's more here\"`-prompt buys another pass.\n\nAsk Claude to read your repo deliberately and report what it finds.\n\n{{prompt:orient-and-introspect-1}}", "b": "## Read your repo deliberately\n\n- You decide what Claude loads: the repo's shape, its structure, what's load-bearing, what's gone stale. A cold agent reads whatever it stumbles into; you point it.\n\n> **Big repo? The read can fan out.** If Claude starts reading dozens of files, interrupt with `Esc`, narrow to one feature or directory, and say `continue`. It can also stop short, and that one is harder to catch because a confident answer arrives either way. If the read names only the files you'd have guessed at, a `\"there's more here\"`-prompt buys another pass.\n\nAsk Claude to read your repo deliberately and report what it finds.\n\n{{prompt:orient-and-introspect-1}}"}, {"id": "lang-01", "kind": "pair", "group": "Language pairs from the sweep", "where": "lectures/what-just-happened.md · You act on the future to know what's real (Module 1)", "ask": "A rhetorical question goes under your 2026-11-01 call, but the maintainer note says the McKinsey beat stays verbatim. Which goes on the slide?", "before": "", "after": "", "a": "## You act on the future to know what's real\n\nTwo beats worth naming, because the mechanism you just used is older than AI.\n\n**You act on the future to know what's real.** Nobody knows where agents are going. Not Anthropic, not your board, not the people running this training. What's known: the people who'll figure it out first are the ones running the experiment. Reading a McKinsey report on the agentic enterprise is not the same category of activity as what you just did. One produces opinions about a future. The other produces muscle memory for it.\n\n**Mental models only come from doing.** Before today, you had a vocabulary. Now you have a little piece of felt experience.\n\nNow: five minutes with the agent. The debrief.", "b": "## You act on the future to know what's real\n\nTwo beats worth naming, because the mechanism you just used is older than AI.\n\n**You act on the future to know what's real.** Nobody knows where agents are going. Not Anthropic, not your board, not the people running this training. What's known: the people who'll figure it out first are the ones running the experiment. Reading a McKinsey report on the agentic enterprise is not the same category of activity as what you just did. One produces opinions about a future. The other produces muscle memory for it. Guess which one transfers.\n\n**Mental models only come from doing.** Before today, you had a vocabulary. Now you have a little piece of felt experience.\n\nNow: five minutes with the agent. The debrief."}, {"id": "lang-02", "kind": "pair", "group": "Language pairs from the sweep", "where": "lectures/compounding.md · What this unlocks (Module 2)", "ask": "Cut whole sentences, or keep two lines that may be the motive for the step?", "before": "", "after": "", "a": "## What this unlocks\n\nYour memory is specific to your challenge. The question you ran through it came back with claims cited to your files, reasoning shaped by your context, a voice that isn't a generic industry take. The answer belongs to the memory you built, not to the LLM behind it. That's the point the whole training turns on: *generic AI becomes your AI when you shape the context that surrounds it.* Guardrails did this at the prompt level in Module 1. A memory does it at the knowledge level now. The mechanism is the same; only the shelf life changed.\n\nEvery module after this leans on that memory. Multi-agent systems reads from it. Security reviews it. Quality evals run against it. The flywheel in Module 8 feeds it. You didn't build a training exercise. You built the material the rest of the training runs on.", "b": "## What this unlocks\n\nYour memory is specific to your challenge. The question you ran through it came back with claims cited to your files, reasoning shaped by your context, a voice that isn't a generic industry take. The answer belongs to the memory you built, not to the LLM behind it. That's the point the whole training turns on: *generic AI becomes your AI when you shape the context that surrounds it.* Guardrails did this at the prompt level in Module 1. A memory does it at the knowledge level now. The mechanism is the same; only the shelf life changed.\n\nEvery module after this leans on that memory. Multi-agent systems reads from it. Security reviews it. Quality evals run against it. The flywheel in Module 8 feeds it."}]</script>
<script id="queue-data" type="application/json">{"_doc": "Active queue for the calls page, most signal first, max 10. Only cards the judge cannot call AND whose answer changes a slide, rule or gold label. One representative per pattern; when answered, similar cards resolve to it (the owning thread scores them). Everything else is backlog. Edit ids here, then rebuild.", "decided_note": "55 slide calls in the latest Module 7 pass were decided by the judge in both orders, so they are not here.", "queue": [{"id": "unsure-488cf42a-10", "decision": "Keep the longer sentence, or cut it?"}, {"id": "unsure-ad58dca3-2", "decision": "Keep the named actor, or cut it?"}, {"id": "unsure-35e7889b-139", "decision": "Cut or keep: the judge flips with the order"}, {"id": "unsure-cc-personal-to-team-8", "decision": "Is losing this concrete sentence damage?"}, {"id": "unsure-a90c9ec2-58", "decision": "Keep the longer wording, or cut it?"}, {"id": "unsure-a90c9ec2-62", "decision": "A coined term vs the plain words that say it"}]}</script>
<script>
const CARDS = JSON.parse(document.getElementById('cards-data').textContent);
const Q = JSON.parse(document.getElementById('queue-data').textContent);
const byId = Object.fromEntries(CARDS.map((c) => [c.id, c]));
const QUEUE = Q.queue.filter((q) => byId[q.id]);
const inQueue = new Set(QUEUE.map((q) => q.id));
const answers = {};
let db = null, cur = null, showFull = false;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const answered = (id) => answers[id] && (answers[id].choice || answers[id].steer);
function inline(t) {
  return esc(t).replace(/&lt;!--[\s\S]*?--&gt;/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '<em>$1</em>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/⟦/g, '<mark>').replace(/⟧/g, '</mark>').replace(/<\/mark>(\s*)<mark>/g, '$1');
}
function md(text) {
  return (text || '').split(/\n{2,}/).map((b) => { const t = b.trim(); if (!t) return '';
    return /^#{1,3} /.test(t) ? `<h3>${inline(t.replace(/^#{1,3} /, ''))}</h3>` : `<p>${inline(t).replace(/\n/g, '<br>')}</p>`; }).join('');
}
function diffMark(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  if (A.length * B.length > 4e6) return [a, b];
  const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, ra = '', rb = '';
  const wrap = (t) => (/^\s+$/.test(t) ? t : `⟦${t}⟧`);
  while (i < n && j < m) {
    if (A[i] === B[j]) { ra += A[i]; rb += B[j]; i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) ra += wrap(A[i++]); else rb += wrap(B[j++]);
  }
  while (i < n) ra += wrap(A[i++]); while (j < m) rb += wrap(B[j++]);
  return [ra, rb];
}
// The changed sentences plus one sentence of context on each side; the rest collapses to an ellipsis.
function excerpt(marked) {
  const body = marked.replace(/^#{1,3} [^\n]*\n+/, '');
  const sents = body.replace(/\n+/g, ' ').split(/(?<=[.!?:*"”)])\s+(?=[A-Z*"“(\[`-])/);
  const hit = sents.map((s) => s.includes('⟦'));
  if (!hit.some(Boolean)) return '<span class="ctx">(no wording change in this version)</span>';
  const keep = hit.map((h, k) => h || hit[k - 1] || hit[k + 1]);
  let out = '', gap = false;
  sents.forEach((s, k) => {
    if (!keep[k]) { gap = true; return; }
    if (gap && out) out += ' <span class="ctx">…</span> ';
    gap = false;
    out += hit[k] ? inline(s) + ' ' : `<span class="ctx">${inline(s)}</span> `;
  });
  return (keep[0] ? '' : '<span class="ctx">… </span>') + out.trim() + (keep[keep.length - 1] ? '' : ' <span class="ctx">…</span>');
}
function head(c) {
  const t = /agents-101|personal-to-team|monday|module-7/.test(c.where + c.id) ? 'Agents 101' : /unsure-[0-9a-f]{8}/.test(c.id) ? 'AE101 history' : 'Agents 101';
  return `<b>${esc(t)}</b> · ${esc(c.where.replace(/\.md\b/g, ''))}`;
}

function renderCard() {
  const open = QUEUE.filter((q) => !answered(q.id));
  const done = QUEUE.length - open.length;
  document.getElementById('prog').textContent = `${done} of ${QUEUE.length}`;
  document.getElementById('bar').style.width = QUEUE.length ? `${(100 * done) / QUEUE.length}%` : '100%';
  const stage = document.getElementById('stage');
  if (cur && answered(cur) && !stage.dataset.hold) cur = null;
  if (!cur || !inQueue.has(cur)) cur = open[0] ? open[0].id : null;
  if (!cur) { stage.innerHTML = `<div class="card done"><p><strong>Queue clear.</strong></p><p class="note">New calls arrive here only when the judge cannot make them.</p></div>`; return; }
  const q = QUEUE.find((x) => x.id === cur), c = byId[cur], a = answers[cur] || {};
  const [ma, mb] = c.a && c.b ? diffMark(c.a, c.b) : [c.a || '', c.b || ''];
  const side = (lbl, marked, raw) => `<div class="side"><span class="label">${lbl}</span>${raw ? `<div class="span">${excerpt(marked)}</div>` : '<div class="span empty">No slide here in this version.</div>'}
      ${showFull && raw ? `<div class="slide">${md(marked)}</div>` : ''}</div>`;
  stage.innerHTML = `<article class="card">
    <div class="head">${head(c)}</div>
    <p class="decision">${esc(q.decision || c.ask)}</p>
    ${side('A', ma, c.a)}${side('B', mb, c.b)}
    <div class="row"><button class="link" id="full">${showFull ? 'Hide full slides' : 'Show full slides'}</button></div>
    <div class="keys">${['A', 'B', 'Neither'].map((o, i) => `<button class="key" data-o="${o}" aria-pressed="${a.choice === o}"><kbd>${i + 1}</kbd>${o}</button>`).join('')}</div>
    <textarea id="why" placeholder="Why, in one line (optional). Type it before pressing a key.">${esc(a.steer || '')}</textarea>
    <div class="row"><span id="st">${a.at ? 'Saved' : ''}</span>${open.length > 1 ? '<button class="link" id="skip">Skip for now</button>' : ''}</div>
  </article>`;
}
function renderFolds() {
  const ans = CARDS.filter((c) => answered(c.id));
  const backlog = CARDS.filter((c) => !answered(c.id) && !inQueue.has(c.id));
  const mini = (c) => `<div class="mini"><span class="who">${esc(c.group)} · ${esc(c.where)}</span>${answered(c.id) ? `<span class="ans">${esc(answers[c.id].choice || 'Steer')}${answers[c.id].steer ? ': ' + esc(answers[c.id].steer) : ''}</span>` : `<span>${esc(c.ask)}</span>`}</div>`;
  const A = document.getElementById('answered'), B = document.getElementById('backlog');
  A.querySelector('summary').textContent = `Answered (${ans.length})`; A.querySelector('div').innerHTML = ans.map(mini).join('');
  B.querySelector('summary').textContent = `Backlog (${backlog.length}), not needed`; B.querySelector('div').innerHTML = backlog.map(mini).join('');
  document.getElementById('decided').textContent = Q.decided_note || '';
}
function render() { renderCard(); renderFolds(); }

async function save(choice) {
  if (!cur) return;
  const id = cur, doc = { choice, conf: '', steer: (document.getElementById('why') || {}).value?.trim() || '', at: new Date().toISOString() };
  answers[id] = doc;
  try { localStorage.setItem('calls-' + id, JSON.stringify(doc)); } catch (_) {}
  cur = null; showFull = false; render();
  if (!db) { document.getElementById('dbnote').hidden = false; document.getElementById('dbnote').textContent = 'Answers are kept in this browser only; the shared record is not reachable in this view.'; return; }
  try { await db.doc('calls/' + id).set(doc); }
  catch (err) { const n = document.getElementById('dbnote'); n.hidden = false; n.textContent = `Could not save ${id}: ${(err && err.message) || err}. It is kept in this browser.`; }
}
document.getElementById('stage').addEventListener('click', (e) => {
  const k = e.target.closest('.key'); if (k) return save(k.dataset.o);
  if (e.target.id === 'full') { showFull = !showFull; renderCard(); }
  if (e.target.id === 'skip') { const open = QUEUE.filter((q) => !answered(q.id)); const i = open.findIndex((q) => q.id === cur); cur = open[(i + 1) % open.length].id; showFull = false; renderCard(); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' && !(e.metaKey || e.ctrlKey)) return;
  const o = { 1: 'A', 2: 'B', 3: 'Neither' }[e.key]; if (o) { e.preventDefault(); save(o); }
});

for (const c of CARDS) { try { const v = localStorage.getItem('calls-' + c.id); if (v) answers[c.id] = JSON.parse(v); } catch (_) {} }
render();
(async () => {
  const note = document.getElementById('dbnote');
  db = window.claude ? await window.claude.use('db') : null;
  if (!db) { note.hidden = false; note.textContent = 'The shared record is not reachable in this view, so answers stay in this browser. Open the page signed in on claude.ai to save them.'; return; }
  const timer = setTimeout(() => { note.hidden = false; note.textContent = 'Still loading saved answers…'; }, 10000);
  db.collection('calls').onSnapshot((snap) => {
    clearTimeout(timer); note.hidden = true;
    for (const d of snap.docs) answers[d.id] = d.data();
    render();
  }, () => { clearTimeout(timer); note.hidden = false; note.textContent = 'Saved answers could not be loaded. New saves may still work.'; });
})();
</script>
