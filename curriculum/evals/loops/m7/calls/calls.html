<script id="cards-data" type="application/json">[{"id": "m7-pair-1", "kind": "pair", "group": "Module 7 blind pairs", "where": "Exercise: Test the sharing plan · Take the transferable move with you", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer.", "before": "## Name the likely failure and Monday move\n\n*12 min*\n\nSix months from now, the teammate went back to the incumbent. The agent writes three failure stories, then turns the strongest evidence into one named conversation and one test.\n\n{{prompt:share-your-work-6}}\n\nThe agent carries the strongest failure pressure into `module-7/monday.md`: one person, one question about how they do the job today, and one selected assumption with its test.", "after": "", "a": "## Take the transferable move with you\n\nInterview for the outcome. Pick the candidate against it. Draft the technical and people plans together. Test the switch, not the solution.", "b": "## Take the transferable move with you\n\nBefore designing a solution, interview for the outcome. Pick the candidate against that outcome. Draft the technical and people plans together. Test the switch, not the solution. A candidate picked because it fits the infrastructure is shopping. A candidate picked because it moves the outcome is design."}, {"id": "m7-pair-2", "kind": "pair", "group": "Module 7 blind pairs", "where": "Lecture: Access is not absorption · The job comes first, the candidate second", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer.", "before": "# Lecture: Access is not absorption\n\nThe rest of this is about the person on the other end of your plan.", "after": "## You cannot share an agent\n\nFour shapes are on the list. Share the context. Share a skill. Share the output (push). Share an interface (pull). *Share the whole agent* is not on the list.\n\nThe agent file is a page of instructions. The work lives in the memory you curated, in the corrections you made, in the judgement you brought to output that looked fine and was not. Hand someone the agent file and they run it, get a generic answer, and quietly stop.\n\n[Three parts copy, one does not](slides/three-parts-copy.md)\n\n[Access is easy; absorption is scarce](slides/access-is-easy.md)", "a": "## The job comes first, the candidate second\n\nStart from the teammate's job, not from your agent. The outcome sentence is the contract: minimize or increase something, while doing that job. A candidate that does not move it is not a candidate.\n\nThe interview earned its keep when it found a third outcome past speed and quality: a dependency removed, an anxiety gone, a scope widened. Speed and quality alone means it went shallow.", "b": "## The job comes first, the candidate second\n\nStart from the teammate's job, not from your agent. The outcome sentence is the contract: minimize or increase something, while doing that job. A candidate that does not move it is not a candidate.\n\nA good interview finds a third outcome past speed and quality: a dependency removed, an anxiety gone, a scope widened."}, {"id": "m7-pair-3", "kind": "pair", "group": "Module 7 blind pairs", "where": "Lecture: Access is not absorption · You cannot share an agent", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer.", "before": "## The job comes first, the candidate second\n\nStart from the teammate's job, not from your agent. The outcome sentence is the contract: minimize or increase something, while doing that job. A candidate that does not move it is not a candidate.\n\nA good interview finds a third outcome past speed and quality: a dependency removed, an anxiety gone, a scope widened.", "after": "## People absorb what they already half know\n\nPeople take up what they already half know. Anyone recognises a new thing by what it resembles in their own work. If it resembles nothing, there is nowhere to put it.\n\nMichael Polanyi, a philosopher of science, had the line for it: *we know more than we can tell.* Your agent runs on the part of your work you never wrote down. Your teammate has their own version, about their own work, and that is where your thing has to land.", "a": "## You cannot share an agent\n\nFour shapes are on the list. Share the context. Share a skill. Share the output (push). Share an interface (pull). *Share the whole agent* is not on the list.\n\nThe agent file is a page of instructions. It is not where the work lives. The work lives in the memory you curated, in the corrections you made every time a summary rounded a corner, in the judgement you brought to output that looked fine and was not. Hand someone the agent file and you have handed them the shell of a thing whose contents are still on your disk and in your head. They run it, get a generic answer, and quietly stop.\n\n[Three parts copy, one does not](slides/three-parts-copy.md)\n\n[Access is easy; absorption is scarce](slides/access-is-easy.md)", "b": "## You cannot share an agent\n\nFour shapes are on the list. Share the context. Share a skill. Share the output (push). Share an interface (pull). *Share the whole agent* is not on the list.\n\nThe agent file is a page of instructions. The work lives in the memory you curated, in the corrections you made, in the judgement you brought to output that looked fine and was not. Hand someone the agent file and they run it, get a generic answer, and quietly stop.\n\n[Three parts copy, one does not](slides/three-parts-copy.md)\n\n[Access is easy; absorption is scarce](slides/access-is-easy.md)"}, {"id": "m7-pair-4", "kind": "pair", "group": "Module 7 blind pairs", "where": "Lecture: Access is not absorption · People absorb what they already half know", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer.", "before": "## You cannot share an agent\n\nFour shapes are on the list. Share the context. Share a skill. Share the output (push). Share an interface (pull). *Share the whole agent* is not on the list.\n\nThe agent file is a page of instructions. The work lives in the memory you curated, in the corrections you made, in the judgement you brought to output that looked fine and was not. Hand someone the agent file and they run it, get a generic answer, and quietly stop.\n\n[Three parts copy, one does not](slides/three-parts-copy.md)\n\n[Access is easy; absorption is scarce](slides/access-is-easy.md)", "after": "## This is the interface piece\n\nContext you chose. Boundaries you set. Checks you wrote. The interface is the first piece whose shape depends on somebody whose calendar you do not control.", "a": "## People absorb what they already half know\n\nPeople take up what they already half know. Anyone recognises a new thing by what it resembles in their own work. If it resembles nothing, there is nowhere to put it.\n\nMichael Polanyi, a philosopher of science, had the line for it: *we know more than we can tell.* Your agent runs on the part of your work you never wrote down. Your teammate has their own version, about their own work, and that is where your thing has to land.", "b": "## People absorb what they already half know\n\nPeople take up what they already half know. Anyone recognises a new thing by what it resembles in their own work. If it resembles nothing, there is nowhere to put it.\n\nMichael Polanyi, a philosopher of science, had the line for it: *we know more than we can tell.* Your agent runs on the part of your work you could never have written down. The teammate you are handing it to has their own version of that, about their own work, and it is the only place your thing can land."}, {"id": "m7-pair-5", "kind": "pair", "group": "Module 7 blind pairs", "where": "Lecture: Access is not absorption · This is the interface piece", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer.", "before": "## People absorb what they already half know\n\nPeople take up what they already half know. Anyone recognises a new thing by what it resembles in their own work. If it resembles nothing, there is nowhere to put it.\n\nMichael Polanyi, a philosopher of science, had the line for it: *we know more than we can tell.* Your agent runs on the part of your work you never wrote down. Your teammate has their own version, about their own work, and that is where your thing has to land.", "after": "## The analysis was ready. The decision never came.\n\nAt the start of 2026 I set out to redesign a whole value stream with agents. We picked the slice that takes a company's flagship product to its millions of customers. Many teams touch it.\n\nWe built a multi-agent system for the work. About fifteen people across those teams mapped their own part and uploaded their own documents. A central agent pulled it all into one map of how the work flows today.\n\nOn the first workshop day, most of them refined that map together. People had fun, and bit by bit they learned how it works. On the second day a smaller group redesigned the flow. We left with a plausible proposal and the analysis to decide on it.\n\nWe had chosen this topic with the senior leadership before we started. By the decision meeting, the urgency had gone. New priorities had come up, and fires were burning elsewhere. The proposal got neither a yes nor a no.\n\nThe leadership had not done the analysis. People they trusted had. Companies, even when they go agentic, work first and foremost on the human principle.\n\nAntti Tevanlinna\n\n[What would have to be true for them to switch?](slides/what-would-have-to-be-true.md)", "a": "## This is the interface piece\n\nIn the full agent picture, this is the interface piece. It is the first one that has another person on the other side of it.\n\nContext you chose. Boundaries you set. Checks you wrote. Each of those was a decision you could make and remake on your own. The interface is the first piece whose shape depends on somebody whose calendar you do not control.", "b": "## This is the interface piece\n\nContext you chose. Boundaries you set. Checks you wrote. The interface is the first piece whose shape depends on somebody whose calendar you do not control."}, {"id": "m7-pair-6", "kind": "pair", "group": "Module 7 blind pairs", "where": "Lecture: Access is not absorption · The analysis was ready. The decision never came.", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer.", "before": "## This is the interface piece\n\nContext you chose. Boundaries you set. Checks you wrote. The interface is the first piece whose shape depends on somebody whose calendar you do not control.", "after": "## The one piece you don't decide\n\nYou can hand someone the context, the skill, the output, the interface. Whether they pick it up is their decision, made for their own reasons, on a Tuesday you will not be in the room for. What you learned getting here is not one of the four things.", "a": "## The analysis was ready. The decision never came.\n\nAt the start of 2026 I set out to redesign a whole value stream with agents. We picked the slice that takes a company's flagship product to its millions of customers. Many teams touch it.\n\nWe built a multi-agent system for the work. About fifteen people across those teams mapped their own part and uploaded their own documents. A central agent pulled it all into one map of how the work flows today.\n\nOn the first workshop day, most of them refined that map together. People had fun, and bit by bit they learned how it works. On the second day a smaller group redesigned the flow. We left with a plausible proposal and the analysis to decide on it.\n\nWe had chosen this topic with the senior leadership before we started. By the decision meeting, the urgency had gone. New priorities had come up, and fires were burning elsewhere. The proposal got neither a yes nor a no.\n\nThe leadership had not done the analysis. People they trusted had.\n\nAntti Tevanlinna\n\n[What would have to be true for them to switch?](slides/what-would-have-to-be-true.md)", "b": "## The analysis was ready. The decision never came.\n\nAt the start of 2026 I set out to redesign a whole value stream with agents. We picked the slice that takes a company's flagship product to its millions of customers. Many teams touch it.\n\nWe built a multi-agent system for the work. About fifteen people across those teams mapped their own part and uploaded their own documents. A central agent pulled it all into one map of how the work flows today.\n\nOn the first workshop day, most of them refined that map together. People had fun, and bit by bit they learned how it works. On the second day a smaller group redesigned the flow. We left with a plausible proposal and the analysis to decide on it.\n\nWe had chosen this topic with the senior leadership before we started. By the decision meeting, the urgency had gone. New priorities had come up, and fires were burning elsewhere. The proposal got neither a yes nor a no.\n\nThe leadership had not done the analysis. People they trusted had. Companies, even when they go agentic, work first and foremost on the human principle.\n\nAntti Tevanlinna\n\n[What would have to be true for them to switch?](slides/what-would-have-to-be-true.md)"}, {"id": "m7-pair-7", "kind": "pair", "group": "Module 7 blind pairs", "where": "Module 7 page · Debrief", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer. The judges split on this one.", "before": "## Start here\n\nStart a fresh session or task at `~/Documents/agents-101/`.\n\nYou start with the agent system you built across Modules 2-6. By the end, `module-7/` holds the sharing plan and `module-7/monday.md` holds the next move.\n\nTwo questions to warm up: who's the one person who came to mind just now? And what makes you hesitate about actually handing this to them?\n\n[Exercise: Interview for the job and pick a candidate](exercises/share-your-work.md)\n\n[Exercise: Design the sharing plan](exercises/design-the-sharing-plan.md)\n\n[Exercise: Test the sharing plan](exercises/test-the-sharing-plan.md)\n\n[Lecture: Access is not absorption](lectures/access-is-not-absorption.md)", "after": "## Push back on the summary\n\nPush back where the agent's summary is wrong. *\"The teammate's job wasn't vague, you just didn't see it\"* / *\"you pulled too much out of the skill, put the edge cases back.\"* The artifact: the sharpened sharing file itself, plus one line in your Module 7 next-step file naming the first move. Save the conversation. It's the bridge to when work resumes.", "a": "## Debrief\n\nFive minutes. The agent reviews the sharing deliverable and sharpens whichever sharing-artifact file you produced (a skill file, an interface description, an output schedule, a context export). The evidence is what's in your Module 7 folder: your JTBD outcome statement, the patterns you picked, the technical plan, the people plan, assumptions, and failure stories. The agent reviews, rewrites the sharing artifact in place, and reports what changed. You push back on anything that's off.\n\n{{prompt:a101-m7-debrief-sharing-artifact}}\n\n> **Watch for slowness.** When you push back on the rewrite, the agent should edit the section you flagged, not rewrite the whole file. The prompt above tells it to. If the agent reaches for a full rewrite anyway, push back: *\"Edit just the section I named.\"*", "b": "## Debrief\n\nFive minutes. The agent reviews the sharing deliverable and sharpens whichever sharing-artifact file you produced (a skill file, an interface description, an output schedule, a context export). The evidence is what's in your Module 7 folder: your JTBD outcome statement, the patterns you picked, the technical plan, the people plan, assumptions, and failure stories. The agent reviews, rewrites the sharing artifact in place, and reports what changed. You push back on anything that's off.\n\n{{prompt:a101-m7-debrief-sharing-artifact}}\n\n> **Watch for slowness.** When you push back on the rewrite, the agent should edit the section you flagged, not rewrite the whole file. The prompt above tells it to. If the agent reaches for a full rewrite anyway, push back: *\"Edit just the section I named.\"*\n\nNotice what this prompt insists on: name the path, overwrite in place, quote the before-and-after for every claim. When you're sharpening something for another person to use, \"what got sharpened\" without the actual lines is a draft pretending to be a finished thing. The before-and-after quote is how you know the sharpening reached the file, not just the summary."}, {"id": "m7-pair-8", "kind": "pair", "group": "Module 7 blind pairs", "where": "Lecture: Access is not absorption · (opening)", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer. The judges split on this one.", "before": "", "after": "## The job comes first, the candidate second\n\nStart from the teammate's job, not from your agent. The outcome sentence is the contract: minimize or increase something, while doing that job. A candidate that does not move it is not a candidate.\n\nThe interview earned its keep when it found a third outcome past speed and quality: a dependency removed, an anxiety gone, a scope widened. Speed and quality alone means it went shallow.", "a": "# Lecture: Access is not absorption\n\nYou have a plan now. A shape picked, an owner named or marked unassigned, an assumption you would test first. The rest of this is about the person on the other end of it.", "b": "# Lecture: Access is not absorption\n\nThe rest of this is about the person on the other end of your plan."}, {"id": "m7-pair-9", "kind": "pair", "group": "Module 7 blind pairs", "where": "Lecture: Access is not absorption · The one piece you don't decide", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer. The judges split on this one.", "before": "## This is the interface piece\n\nIn the full agent picture, this is the interface piece. It is the first one that has another person on the other side of it.\n\nContext you chose. Boundaries you set. Checks you wrote. Each of those was a decision you could make and remake on your own. The interface is the first piece whose shape depends on somebody whose calendar you do not control.\n\n[What would have to be true for them to switch?](slides/what-would-have-to-be-true.md)", "after": "## The people plan stalls on names\n\nThe technical plan fills quickly. The people plan stalls on names.\n\nA missing name is a finding: it marks the part of this that is not built yet, and it is the part that decides whether any of the rest gets used.\n\nSo the move stays small. One name. One person whose week this would change, who would tell you plainly if it did not.", "a": "## The one piece you don't decide\n\nEvery piece so far was yours to decide. This one is not. You can hand someone the context, the skill, the output, the interface. Whether they pick it up is their decision, made for their own reasons, on a Tuesday you will not be in the room for.\n\nThe thing you would most like to hand over is the one thing that will not go. You cannot hand over what you learned getting here. You can hand over four things, and none of them is what you learned.", "b": "## The one piece you don't decide\n\nYou can hand someone the context, the skill, the output, the interface. Whether they pick it up is their decision, made for their own reasons, on a Tuesday you will not be in the room for. What you learned getting here is not one of the four things."}, {"id": "m7-r2-lecture", "kind": "pair", "group": "Module 7 round 2", "where": "Lecture: Access is not absorption · whole lecture", "ask": "Two whole closing lectures. One is your current lecture after edits; the other was regenerated from your strategy input and the rules, with the exercises fixed. Which one goes in front of the room?", "before": "", "after": "", "a": "# Lecture: Access is not absorption\n\nThe rest of this is about the person on the other end of your plan.\n\n## The job comes first, the candidate second\n\nStart from the teammate's job, not from your agent. The outcome sentence is the contract: minimize or increase something, while doing that job. A candidate that does not move it is not a candidate.\n\nA good interview finds a third outcome past speed and quality: a dependency removed, an anxiety gone, a scope widened.\n\n## You cannot share an agent\n\nFour shapes are on the list. Share the context. Share a skill. Share the output (push). Share an interface (pull). *Share the whole agent* is not on the list.\n\nThe agent file is a page of instructions. The work lives in the memory you curated, in the corrections you made, in the judgement you brought to output that looked fine and was not. Hand someone the agent file and they run it, get a generic answer, and quietly stop.\n\n[Three parts copy, one does not](slides/three-parts-copy.md)\n\n## This is the interface piece\n\nContext you chose. Boundaries you set. Checks you wrote. The interface is the first piece whose shape depends on somebody whose calendar you do not control.\n\n## The analysis was ready. The decision never came.\n\nAt the start of 2026 I set out to redesign a whole value stream with agents. We picked the slice that takes a company's flagship product to its millions of customers. Many teams touch it.\n\nWe built a multi-agent system for the work. About fifteen people across those teams mapped their own part and uploaded their own documents. A central agent pulled it all into one map of how the work flows today.\n\nOn the first workshop day, most of them refined that map together. People had fun, and bit by bit they learned how it works. On the second day a smaller group redesigned the flow. We left with a plausible proposal and the analysis to decide on it.\n\nWe had chosen this topic with the senior leadership before we started. By the decision meeting, the urgency had gone. New priorities had come up, and fires were burning elsewhere. The proposal got neither a yes nor a no.\n\nThe leadership had not done the analysis. People they trusted had. Companies, even when they go agentic, work first and foremost on the human principle.\n\nAntti Tevanlinna\n\n[Access is easy; absorption is scarce](slides/access-is-easy.md)\n\n## People absorb what they already half know\n\nPeople take up what they already half know. Anyone recognises a new thing by what it resembles in their own work. If it resembles nothing, there is nowhere to put it.\n\nMichael Polanyi, a philosopher of science, had the line for it: *we know more than we can tell.* Your agent runs on the part of your work you never wrote down. Your teammate has their own version, about their own work, and that is where your thing has to land.\n\n[What would have to be true for them to switch?](slides/what-would-have-to-be-true.md)\n\n## The one piece you don't decide\n\nYou can hand someone the context, the skill, the output, the interface. Whether they pick it up is their decision, made for their own reasons, on a Tuesday you will not be in the room for. What you learned getting here is not one of the four things.\n\n## The people plan stalls on names\n\nThe technical plan fills quickly. The people plan stalls on names.\n\nA missing name is a finding: it marks the part of this that is not built yet, and it is the part that decides whether any of the rest gets used.\n\nSo the move stays small. One name. One person whose week this would change, who would tell you plainly if it did not.", "b": "# Lecture: Access is not absorption\n\nOne law decides whether a sharing plan works. This lecture names it and shows where it applies.\n\n[Access is easy; absorption is scarce](slides/access-is-easy.md)\n\n## The analysis was ready. The decision never came.\n\nAt the start of 2026 I set out to redesign a whole value stream with agents. We picked the slice that takes a company's flagship product to its millions of customers. Many teams touch it.\n\nWe built a multi-agent system for the work. About fifteen people across those teams mapped their own part and uploaded their own documents. A central agent pulled it all into one map of how the work flows today.\n\nOn the first workshop day, most of them refined that map together. People had fun, and bit by bit they learned how it works. On the second day a smaller group redesigned the flow. We left with a plausible proposal and the analysis to decide on it.\n\nWe had chosen this topic with the senior leadership before we started. By the decision meeting, the urgency had gone. New priorities had come up, and fires were burning elsewhere. The proposal got neither a yes nor a no.\n\nThe leadership had not done the analysis. People they trusted had. Companies, even when they go agentic, work first and foremost on the human principle.\n\nAntti Tevanlinna\n\n## The people who mapped the work absorbed it\n\nThe fifteen people learned the system by putting their own documents into it, over two days, at their own pace. The people who had to decide received the finished analysis. They had full access to it. They had not spent any of their own weeks inside it. A sharing plan that ends when the result is delivered stops where that project stopped.\n\n[Three parts copy, one does not](slides/three-parts-copy.md)\n\n## Each strategy puts absorption somewhere else\n\nWhen you share the context, your teammate has to absorb your curation, and that asks for the most trust. When you share a skill, they absorb one bounded capability inside an agent they already run. Shared output lands on a schedule, in a place they already look. With a shared interface, they ask in their own words when the job comes up. The right choice is the one that fits the week your teammate already has.\n\n[What would have to be true for them to switch?](slides/what-would-have-to-be-true.md)\n\n## One name, one small move\n\n`module-7/monday.md` holds one person, one question about how they do the job today, and one assumption to test. The plan stays a hypothesis until that person answers. Send them a message today and ask for twenty minutes of their week. Ask the question in the file, then listen to how they do the job now."}, {"id": "m7-r2-1", "kind": "pair", "group": "Module 7 round 2", "where": "Module 7 page · Big Idea", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer. The taste judge split on this one.", "before": "# From Personal to Team", "after": "## Prework\n\nBring one example from your own organisation where people got access to something and did not use it. A licence rollout, a shared drive, a portal, an internal tool. Write two or three sentences on what was switched on and what never followed.\n\nThe example gives the closing lecture something real to land on. If you don't bring one, the module's main idea stays general when it could be about your own company.", "a": "## Big Idea\n\nYou cannot really share an agent. You can share its context, a skill, its output or an interface, and the one you pick is a strategy decision.", "b": "## Big Idea\nYou can't really share an agent. You can share context, a skill, the output, or an interface. The hard part is not access; it is absorption."}, {"id": "m7-r2-2", "kind": "pair", "group": "Module 7 round 2", "where": "Module 7 page · Debrief", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer. The taste judge split on this one.", "before": "## Start here\n\nPick one teammate who could use what your agent produces. What would you want them to have: your folder, one of your skills, the morning output, or a way to ask the agent a question in Slack? Why that one?\n\nStart a fresh session at `~/Documents/agents-101/`. The agent writes the sharing plan into `module-7/`, and `module-7/monday.md` holds the next move: one person, one question, one test.\n\nThe four sharing strategies:\n\n1. **Share the context.** Your `memory/`, `sources/`, root `CLAUDE.md` and `style.md` travel. Teammates build their own agent on top of your curation.\n2. **Share a skill.** One scoped capability, extracted as a skill file. Teammates plug it into their own agents.\n3. **Share the output (push).** The agent runs on a schedule. Its output lands where the team already looks.\n4. **Share an interface (pull).** The agent sits behind a bot, a mention, a form or an endpoint. Teammates ask in their own words when they need it.\n\n[Exercise: Interview for the job and pick a candidate](exercises/share-your-work.md)\n\n[Exercise: Design the sharing plan](exercises/design-the-sharing-plan.md)\n\n[Exercise: Test the sharing plan](exercises/test-the-sharing-plan.md)\n\n[Lecture: Access is not absorption](lectures/access-is-not-absorption.md)", "after": "## Key Concepts\n\n- Start from the teammate's job. Your candidate competes with the way they get that job done today.\n- Pick one of the four: context, skill, output or interface. Push delivers on a schedule. Pull waits until someone asks.\n- The bottleneck worth solving is the one that explains why the other obstacles stay hard.\n- Write the people plan next to the technical plan. A role with no name on it tells you who to talk to next.\n- Test the switch, not the solution.\n- Access is a switch someone flips. Absorption happens in other people's weeks, at their pace, for their reasons.", "a": "## Debrief\n\nRun this in the same session.\n\n{{prompt:a101-m7-debrief-sharing-artifact}}", "b": "## Debrief\n\nFive minutes. The agent reviews the sharing deliverable and sharpens whichever sharing-artifact file you produced (a skill file, an interface description, an output schedule, a context export). The evidence is what's in your Module 7 folder: your JTBD outcome statement, the patterns you picked, the technical plan, the people plan, assumptions, and failure stories. The agent reviews, rewrites the sharing artifact in place, and reports what changed. You push back on anything that's off.\n\n{{prompt:a101-m7-debrief-sharing-artifact}}\n\n> **Watch for slowness.** When you push back on the rewrite, the agent should edit the section you flagged, not rewrite the whole file. The prompt above tells it to. If the agent reaches for a full rewrite anyway, push back: *\"Edit just the section I named.\"*\n\nNotice what this prompt insists on: name the path, overwrite in place, quote the before-and-after for every claim. When you're sharpening something for another person to use, \"what got sharpened\" without the actual lines is a draft pretending to be a finished thing. The before-and-after quote is how you know the sharpening reached the file, not just the summary."}, {"id": "m7-r2-3", "kind": "pair", "group": "Module 7 round 2", "where": "Module 7 page · Bring to Module 8", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer. The taste judge split on this one.", "before": "## Key Concepts\n\n- Start from the teammate's job. Your candidate competes with the way they get that job done today.\n- Pick one of the four: context, skill, output or interface. Push delivers on a schedule. Pull waits until someone asks.\n- The bottleneck worth solving is the one that explains why the other obstacles stay hard.\n- Write the people plan next to the technical plan. A role with no name on it tells you who to talk to next.\n- Test the switch, not the solution.\n- Access is a switch someone flips. Absorption happens in other people's weeks, at their pace, for their reasons.", "after": "## Next\n\nYou can now build an agent, secure it, evaluate it and share it with a team in any of four shapes. So far you have built each version by hand. Module 8 puts the agent to work on the building.", "a": "## Bring to Module 8\n\n**Bring what your Monday contact said, in their own words.** Their answer shows which assumption held up. That evidence tells you what to build next, and the plan cannot supply it.", "b": "## Bring to Module 8\n\n**Run `module-7/monday.md`.** Test one assumption. Ask for one name. Talk to one person. Module 8 works from what happened when the sharing plan touched the real organisation, so it needs a plan that has touched one.\n\nCome to Module 8 without one tested assumption or named person and you'll be reconstructing the contact while the opening exercise is already using the evidence. Your call.\n\nOnce the evidence is written down, end this module's session or task. Module 8 starts fresh at `~/Documents/agents-101/`."}, {"id": "m7-r2-4", "kind": "pair", "group": "Module 7 round 2", "where": "Lecture: Access is not absorption · (opening)", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer. The taste judge split on this one.", "before": "", "after": "## The analysis was ready. The decision never came.\n\nAt the start of 2026 I set out to redesign a whole value stream with agents. We picked the slice that takes a company's flagship product to its millions of customers. Many teams touch it.\n\nWe built a multi-agent system for the work. About fifteen people across those teams mapped their own part and uploaded their own documents. A central agent pulled it all into one map of how the work flows today.\n\nOn the first workshop day, most of them refined that map together. People had fun, and bit by bit they learned how it works. On the second day a smaller group redesigned the flow. We left with a plausible proposal and the analysis to decide on it.\n\nWe had chosen this topic with the senior leadership before we started. By the decision meeting, the urgency had gone. New priorities had come up, and fires were burning elsewhere. The proposal got neither a yes nor a no.\n\nThe leadership had not done the analysis. People they trusted had. Companies, even when they go agentic, work first and foremost on the human principle.\n\nAntti Tevanlinna", "a": "# Lecture: Access is not absorption\n\nYou have a plan now. A shape picked, an owner named or marked unassigned, an assumption you would test first. The rest of this is about the person on the other end of it.", "b": "# Lecture: Access is not absorption\n\nOne law decides whether a sharing plan works. This lecture names it and shows where it applies.\n\n[Access is easy; absorption is scarce](slides/access-is-easy.md)"}, {"id": "m7-r2-5", "kind": "pair", "group": "Module 7 round 2", "where": "Lecture: Access is not absorption · Each strategy puts absorption somewhere else", "ask": "Two versions of the same slide. Pick the one you would put in front of the room, or steer. The taste judge split on this one.", "before": "## The people who mapped the work absorbed it\n\nThe fifteen people learned the system by putting their own documents into it, over two days, at their own pace. The people who had to decide received the finished analysis. They had full access to it. They had not spent any of their own weeks inside it. A sharing plan that ends when the result is delivered stops where that project stopped.\n\n[Three parts copy, one does not](slides/three-parts-copy.md)", "after": "## One name, one small move\n\n`module-7/monday.md` holds one person, one question about how they do the job today, and one assumption to test. The plan stays a hypothesis until that person answers. Send them a message today and ask for twenty minutes of their week. Ask the question in the file, then listen to how they do the job now.", "a": "", "b": "## Each strategy puts absorption somewhere else\n\nWhen you share the context, your teammate has to absorb your curation, and that asks for the most trust. When you share a skill, they absorb one bounded capability inside an agent they already run. Shared output lands on a schedule, in a place they already look. With a shared interface, they ask in their own words when the job comes up. The right choice is the one that fits the week your teammate already has.\n\n[What would have to be true for them to switch?](slides/what-would-have-to-be-true.md)"}, {"id": "scar-1-placement", "kind": "choice", "group": "Scar stories", "where": "Lecture: Access is not absorption · after \"This is the interface piece\"", "ask": "Your value-stream story, drafted from your dictation into the open Module 7 slot (12 to 18 lines, first person, no lesson line). Does it go in?", "text": "## The analysis was ready. The decision never came.\n\nAt the start of 2026 I set out to redesign a whole value stream with agents. We picked the slice that takes a company's flagship product to its millions of customers. Many teams touch it.\n\nWe built a multi-agent system for the work. About fifteen people across those teams mapped their own part and uploaded their own documents. A central agent pulled it all into one map of how the work flows today.\n\nOn the first workshop day, most of them refined that map together. People had fun, and bit by bit they learned how it works. On the second day a smaller group redesigned the flow. We left with a plausible proposal and the analysis to decide on it.\n\nWe had chosen this topic with the senior leadership before we started. By the decision meeting, the urgency had gone. New priorities had come up, and fires were burning elsewhere. The proposal got neither a yes nor a no.\n\nThe leadership had not done the analysis. People they trusted had.\n\nAntti Tevanlinna\n\n[What would have to be true for them to switch?](slides/what-would-have-to-be-true.md)", "options": ["Yes, as drafted", "Yes, and close on my line about the human principle", "Yes, and name the Workflow Architect", "Somewhere else (say where)", "Not yet"]}, {"id": "scar-2-placement", "kind": "choice", "group": "Scar stories", "where": "Being ahead of time (spar of 2026-10-28), not drafted", "ask": "Your second story, about working in a different way from everyone around you. Where should it be drafted? Guard: the tedium is yours to own; it must not put down people who spec and meet.", "text": "Your own lines from the spar:\n\n\"I approach all my work with agents, compounding, outcomes and broad analysis. Pretty much everyone still approaches problems by writing confluence pages. And having meetings. Drawing diagrams. I feel I've lost common language.\"\n\nThree colleagues started an agent factory in AWS. \"What's the capabilities you are building at? They say: we have few problems to solve.\"\n\n\"I have always held the prototyping approach. 10 iterations is totally fine. They get better.\"\n\n\"It sometimes feels too inefficient and tedious to take part in the slowness of humans speccing and speculating in chats and meetings.\"", "options": ["Draft it as the Module 1 opening", "Draft it for Module 7, beside \"people absorb what they already half know\"", "Keep it for the trainer to tell, not on a slide", "Not yet"]}, {"id": "line-unglamorous", "kind": "choice", "group": "Loaded lines you flagged", "where": "Slide: It reads the whole conversation every time (Module 1)", "ask": "Your objection: the weird rhetoric question. Keep, cut to the neutral version, or steer.", "text": "That's context. Unglamorous, isn't it? And yet every useful thing in this training is built on this one idea.", "alt": "That's context. Every useful thing in this training is built on it.", "options": ["Use the neutral version", "Keep as it is", "Cut it entirely", "Different wording (steer)"]}, {"id": "line-toy", "kind": "choice", "group": "Loaded lines you flagged", "where": "Lecture: Compounding (Module 2), and the same word in two more files", "ask": "Your objection: calling something a student may make a \"toy\". Keep, cut to the neutral version, or steer.", "text": "Either one alone is a toy. A saved document with no agent is just a document. An agent with no files is a chat.", "alt": "A saved document with no agent is a document. An agent with no files is a chat.", "options": ["Use the neutral version", "Keep as it is", "Cut it entirely", "Different wording (steer)"]}, {"id": "line-fantasy", "kind": "choice", "group": "Loaded lines you flagged", "where": "Lecture: The discipline of risk (Module 4), heading", "ask": "Your objection: \"both fantasy and inherited give me the biggest creeps\". Keep, cut to the neutral version, or steer.", "text": "## Certainty is a fantasy you inherited", "alt": "## Deterministic software can prove a fix", "options": ["Use the neutral version", "Keep as it is", "Cut it entirely", "Different wording (steer)"]}, {"id": "line-old-story", "kind": "choice", "group": "Loaded lines you flagged", "where": "Lecture: The discipline of risk (Module 4), body under that heading", "ask": "Your objection: \"puts down the historical sensible practise. It also misrepresents that to make a point.\". Keep, cut to the neutral version, or steer.", "text": "Software security, done well, sells you a clean story. Perimeter. Access control. Patch the bug, sign off the build, the system is secure. You've probably worked with people who live inside that story and mostly do a good job of it. The story works because classical software is deterministic (same input, same output). You can find the bug, prove you fixed it, and sleep.", "alt": "Classical software security works because the software is deterministic: same input, same output. You can find the bug, prove you fixed it, and sign off the build.", "options": ["Use the neutral version", "Keep as it is", "Cut it entirely", "Different wording (steer)"]}, {"id": "line-only-check", "kind": "choice", "group": "Loaded lines you flagged", "where": "Lecture: What just happened (Module 1), heading", "ask": "Your objection: \"twists human into some weird mold. I think student would never call themselves check.\". Keep, cut to the neutral version, or steer.", "text": "## You were the only check in the room", "alt": "## The agent generated, you decided", "options": ["Use the neutral version", "Keep as it is", "Cut it entirely", "Different wording (steer)"]}, {"id": "m4-cand-1", "kind": "choice", "group": "Module 4 sentences the simulated students skipped", "where": "trainings/agents-101/security.md#prework", "ask": "Simulated students went dead on this sentence. Pick or steer.", "said": ["cfo-sceptic (boredom): nothing new", "cfo-sceptic (boredom): nothing new. It's a reading list.", "cto-builder (boredom): nothing new, more reading homework"], "text": "The Module 4 prework adds two reads: (1) personal skills as the package format that carries expertise into your agent, (2) agent risk layered on top of normal security work.", "options": ["Use: The Module 4 prework adds two reads: personal skills, and agent risk on top of normal security work.", "Cut the sentence", "Keep as it is", "Different wording (steer)"]}, {"id": "m4-cand-2", "kind": "choice", "group": "Module 4 sentences the simulated students skipped", "where": "exercises/audit-your-agent.md#phase-1-load-the-reusable-check", "ask": "Simulated students went dead on this sentence. Pick or steer.", "said": ["cfo-sceptic (boredom): nothing new", "cfo-sceptic (boredom): nothing new", "cto-builder (boredom): nothing new, check the skill loaded"], "text": "Type `/` in the prompt and look for `/security-audit` in the autocomplete list.", "options": ["Cut the sentence", "Use: Type `/` and look for `/security-audit`.", "Keep as it is", "Different wording (steer)"]}, {"id": "m4-cand-3", "kind": "choice", "group": "Module 4 sentences the simulated students skipped", "where": "lectures/agent-loop-raw.md", "ask": "Simulated students went dead on this sentence. Pick or steer.", "said": ["cfo-sceptic (boredom): The agent writes a command and the system runs it. Fine, but I don't see the cost or the risk in it.", "ingrid (boredom): A tool call is just text that the runtime turns into an action, so the boundary is where risk sits. It's a useful framing, but a detour from my pricing decision.", "cfo-sceptic (boredom): The agent writes text and the system turns it into actions. That's fair enough."], "text": "A tool call is not a new species of work.", "options": ["Cut the sentence", "Use: A tool call is text. The runtime makes it an action.", "Keep as it is", "Different wording (steer)"]}, {"id": "m4-cand-4", "kind": "choice", "group": "Module 4 sentences the simulated students skipped", "where": "lectures/practice-of-risk.md#certainty-is-a-fantasy-you-inherited", "ask": "Simulated students went dead on this sentence. Pick or steer.", "said": ["cto-builder (boredom): nothing new, determinism vs not", "cto-builder (boredom): nothing new. deterministic software vs agents is old news for my engineers", "ingrid (boredom): nothing new, I know old security was deterministic"], "text": "The story works because classical software is deterministic (same input, same output).", "options": ["Cut the sentence", "Use: The story works because classical software repeats itself: same input, same output.", "Keep as it is", "Different wording (steer)"]}, {"id": "m4-cand-6", "kind": "choice", "group": "Module 4 sentences the simulated students skipped", "where": "exercises/audit-your-agent.md#separate-prototype-from-production", "ask": "Simulated students went dead on this sentence. Pick or steer.", "said": ["ingrid (boredom): nothing new, it's two lines with no content", "ingrid (boredom): nothing new. It's a thin point with no substance behind it.", "ingrid (boredom): Nothing new. Production needs more than one mitigation."], "text": "You must do the work.", "options": ["Cut the sentence", "Use: One mitigation is a start. A production agent needs one for each risk.", "Use: Repeat this for every risk you found, not just one.", "Keep as it is", "Different wording (steer)"]}, {"id": "m4-cand-7", "kind": "choice", "group": "Module 4 sentences the simulated students skipped", "where": "trainings/agents-101/security.md#bring-to-module-5", "ask": "Simulated students went dead on this sentence. Pick or steer.", "said": ["cto-builder (boredom): homework: one sentence per case. I'd probably skip it and catch up live", "cto-builder (frustration): Homework: one sentence per case. I'd probably skip it.", "ingrid (frustration): Homework with a mild threat attached, and I'm not sure what the two cases are yet."], "text": "Come to Module 5 without the two missing-check sentences and you'll be reconstructing them while the benchmark is already comparing detectors.", "options": ["Cut the sentence", "Use: Skip the two sentences and you'll be catching up during Module 5.", "Use: Without the two sentences, you'll be catching up while Module 5 moves on.", "Keep as it is", "Different wording (steer)"]}, {"id": "m4-cand-8", "kind": "choice", "group": "Module 4 sentences the simulated students skipped", "where": "exercises/author-security-skill.md#answer-the-grill-then-sharpen-the-lenses", "ask": "Simulated students went dead on this sentence. Pick or steer.", "said": ["cfo-sceptic (boredom): nothing new", "cto-builder (boredom): nothing new, iterate the output"], "text": "Push back until the report shape is narrow enough that you will actually read it on Monday.", "options": ["Cut the sentence", "Use: Push back until the report is short enough to read on Monday.", "Keep as it is", "Different wording (steer)"]}, {"id": "m4-cand-9", "kind": "choice", "group": "Module 4 sentences the simulated students skipped", "where": "exercises/author-security-skill.md#take-stock-of-the-packaged-check", "ask": "Simulated students went dead on this sentence. Pick or steer.", "said": ["ingrid (boredom): nothing new, it restates that the skill is the expert", "ingrid (surprise): What I built today is a check, not a prompt, and it still works next week.", "ingrid (boredom): nothing new, a summary of what I just did"], "text": "The policy files are source material.", "options": ["Cut the sentence", "Use: The policy files are the source. The check is what you keep.", "Keep as it is", "Different wording (steer)"]}, {"id": "m4-cand-10", "kind": "choice", "group": "Module 4 sentences the simulated students skipped", "where": "exercises/author-security-skill.md#phase-3-author-both-lenses", "ask": "Simulated students went dead on this sentence. Pick or steer. This may be a permission beat, a kind of line you have kept before.", "said": ["cfo-sceptic (frustration): Another round of questions before I get anything out of it.", "cfo-sceptic (confusion): The agent made a reusable audit file. I don't know what it cost or how long it took.", "cfo-sceptic (frustration): A long round of questions before I get anything back."], "text": "You'll get a lot of questions.", "options": ["Use: The questions are how the skill gets built.", "Cut the sentence", "Keep as it is", "Different wording (steer)"]}, {"id": "disc-01", "kind": "pair", "group": "One sentence: cut or keep", "where": "lectures/where-is-this-all-going.md · Three walls past the laptop", "ask": "The same section with and without one sentence. Which goes in front of the room?", "before": "", "after": "", "a": "## Three walls past the laptop\n\nSeeing one of them named is the sign the kernel worked on something real. A plan with no wall in it was written about a laptop.", "b": "## Three walls past the laptop\n\nThe plan names which wall your company hits first, and there are three: data access, the runtime platform, and discoverability. Seeing one of them named is the sign the kernel worked on something real. A plan with no wall in it was written about a laptop."}, {"id": "disc-02", "kind": "pair", "group": "One sentence: cut or keep", "where": "lectures/compounding.md · Three layers, one folder", "ask": "The same section with and without one sentence. Which goes in front of the room?", "before": "", "after": "", "a": "## Three layers, one folder\n\nThe raw sources sit untouched, the originals you dropped in. The memory sits above them: the topic pages the agent maintains and sharpens. The rules file sits on top and keeps the shape of every update the same.\n\nSharpen the memory, never the sources, or you lose the evidence. Change the rules, and every later update changes with them.", "b": "## Three layers, one folder\n\nThe folder has three layers, and they stay separate on purpose. The raw sources sit untouched, the originals you dropped in. The memory sits above them: the topic pages the agent maintains and sharpens. The rules file sits on top and keeps the shape of every update the same.\n\nSharpen the memory, never the sources, or you lose the evidence. Change the rules, and every later update changes with them."}, {"id": "disc-03", "kind": "pair", "group": "One sentence: cut or keep", "where": "exercises/share-your-work.md · Carry the two files forward", "ask": "The same section with and without one sentence. Which goes in front of the room?", "before": "", "after": "", "a": "## Carry the two files forward\n\nYou now have the teammate's job and a candidate selected against it. [Design the sharing plan](design-the-sharing-plan.md) finds what would stop that candidate from being absorbed and turns it into a technical plan plus a people plan.\n\n--- end exercises/share-your-work.md\n\n\n\n--- exercises/design-the-sharing-plan.md", "b": "## Carry the two files forward\n\n[Design the sharing plan](design-the-sharing-plan.md) finds what would stop that candidate from being absorbed and turns it into a technical plan plus a people plan.\n\n--- end exercises/share-your-work.md\n\n\n--- exercises/design-the-sharing-plan.md"}, {"id": "disc-04", "kind": "pair", "group": "One sentence: cut or keep", "where": "lectures/skills-from-the-frontier.md · Start here", "ask": "The same section with and without one sentence. Which goes in front of the room?", "before": "", "after": "", "a": "## Start here\n\nStart a fresh session or task at `~/Documents/agents-101/`.\n\nThis module's outputs land in `module-1/`.\n\n**The question, to you:** when you've used an LLM for your own work (a bio, a pitch, a post), where did the output come out generic? Was there ever a moment where it actually felt like yours, and if so, what made the difference?\n\n\n--- lectures/context-is-king.md", "b": "## Start here\n\nThis module's outputs land in `module-1/`.\n\n**The question, to you:** when you've used an LLM for your own work (a bio, a pitch, a post), where did the output come out generic? Was there ever a moment where it actually felt like yours, and if so, what made the difference?\n\n--- lectures/context-is-king.md"}, {"id": "disc-05", "kind": "pair", "group": "One sentence: cut or keep", "where": "trainings/agents-101/getting-going.md · Push back on what the retro missed", "ask": "The same section with and without one sentence. Which goes in front of the room?", "before": "", "after": "", "a": "## Push back on what the retro missed\n\nTwo patterns to watch. The LLM is generous to a rules file it just helped write. *\"Mostly worked, small sharpens\"* is the agent grading its own work charitably. The prose summary rounds corners.\n\nPush back on anything that doesn't match your sense of the work. That's the pattern: every time you do work like this and reflect, the rules file gets sharper. **Compound interest on a rule file.** This is the move you'll use on every agent file you write from here on: do the work → capture the rules → reflect → sharpen the rules. Module 2 systematises it; Module 1 lands the muscle.", "b": "## Push back on what the retro missed\n\nTwo patterns to watch. The LLM is generous to a rules file it just helped write. *\"Mostly worked, small sharpens\"* is the agent grading its own work charitably. The prose summary rounds corners.\n\nPush back on anything that doesn't match your sense of the work. That's the pattern: every time you do work like this and reflect, the rules file gets sharper. **Compound interest on a rule file.** This is the move you'll use on every agent file you write from here on: do the work → capture the rules → reflect → sharpen the rules."}, {"id": "disc-06", "kind": "pair", "group": "One sentence: cut or keep", "where": "exercises/personal-site-with-guardrails.md · See the mechanism repeat in every phase", "ask": "The same section with and without one sentence. Which goes in front of the room?", "before": "", "after": "", "a": "## See the mechanism repeat in every phase\n\n**What happened:**\n\nPhase 1 is fine. Phase 6 is yours. The mechanism is the same every phase. The agent's output is shaped by what you put in the context ahead of the task. Your LinkedIn was context. Your colleague-guide frame was context. Your strengths were context. Your mirror-list was context. The more specific the context, the more genuinely \"you\" the output.", "b": "## See the mechanism repeat in every phase\n\n**What happened:**\n\nPhase 1 is fine. Phase 6 is yours. The mechanism is the same every phase. The agent's output is shaped by what you put in the context ahead of the task. Your LinkedIn was context. Your colleague-guide frame was context. Your strengths were context. Your mirror-list was context. The more specific the context, the more genuinely \"you\" the output.\n\nThat's the whole of Module 1's big idea, proven with your own name on it."}, {"id": "disc-07", "kind": "pair", "group": "One sentence: cut or keep", "where": "lectures/access-is-not-absorption.md · The people plan stalls on names", "ask": "The same section with and without one sentence. Which goes in front of the room?", "before": "", "after": "", "a": "## The people plan stalls on names\n\nYou felt this an hour ago. The technical plan filled quickly. The people plan stalled on names. That was the exercise being accurate. A missing name is a finding: it marks the part of this that is not built yet, and it is the part that decides whether any of the rest gets used.\n\nSo the move stays small. One name. One person whose week this would change, who would tell you plainly if it did not.\n\n--- end lectures/access-is-not-absorption.md", "b": "## The people plan stalls on names\n\nYou felt this an hour ago. The technical plan filled quickly. The people plan stalled on names.\n\nThat was not the exercise being hard. That was the exercise being accurate. A missing name is a finding: it marks the part of this that is not built yet, and it is the part that decides whether any of the rest gets used.\n\nSo the move stays small. One name. One person whose week this would change, who would tell you plainly if it did not.\n\n--- end lectures/access-is-not-absorption.md"}, {"id": "disc-08", "kind": "pair", "group": "One sentence: cut or keep", "where": "slides/only-what-someone-wrote-down.md · It can only use what someone wrote down", "ask": "The same section with and without one sentence. Which goes in front of the room?", "before": "", "after": "", "a": "## It can only use what someone wrote down\n\nOne limit worth seeing while the memory is fresh in front of you.\n\nThe agent can only work from what somebody wrote down. Most of what you know about your own company, nobody has. It sits in heads, in corridors, in the judgement of the person who has been there long enough to stop noticing they have it.\n\nThat is not a fault in the memory you built. It is why the memory you built is worth something. Every round of this moves one more piece of what you know out of your head and into something the system can read next time.\n\n--- end lectures/compounding.md", "b": "## It can only use what someone wrote down\n\nOne limit worth seeing while the memory is fresh in front of you.\n\nThe agent can only work from what somebody wrote down. Most of what you know about your own company, nobody has. It sits in heads, in corridors, in the judgement of the person who has been there long enough to stop noticing they have it. It is why the memory you built is worth something. Every round of this moves one more piece of what you know out of your head and into something the system can read next time.\n\n--- end lectures/compounding.md"}, {"id": "disc-09", "kind": "pair", "group": "One sentence: cut or keep", "where": "lectures/when-to-split-an-agent.md · More agents is not more rigour", "ask": "The same section with and without one sentence. Which goes in front of the room?", "before": "", "after": "", "a": "## More agents is not more rigour\n\nNote what's not on the list: *\"because three is more thorough.\"* More agents is more prompts to tune, more noise in the synthesis, more coordination tax. Split for a reason.\n\nAnd more input is not the fix either. The beige answer was not short of context. It had three stances in front of it and could not choose between them.", "b": "## More agents is not more rigour\n\nMore agents is more prompts to tune, more noise in the synthesis, more coordination tax. Split for a reason.\n\nAnd more input is not the fix either. The beige answer was not short of context. It had three stances in front of it and could not choose between them."}, {"id": "disc-10", "kind": "pair", "group": "One sentence: cut or keep", "where": "exercises/eval-loop.md · Put another judge in the same loop", "ask": "The same section with and without one sentence. Which goes in front of the room?", "before": "", "after": "", "a": "## Put another judge in the same loop\n\n**Take-home: put any judge in a loop that improves the thing it scores.**\n\nAny judge you own becomes infrastructure the moment you stop editing it and start improving what it scores.\n\nAsk the agent to set up the loop around a different judge:\n\n{{prompt:eval-loop-6}}\n\nConvergence was the floor in Module 5. Eval-as-yardstick is the ceiling here. The next natural question (*who else on my team would want this?*) is Module 7's problem.\n\n--- end exercises/eval-loop.md\n\n\n\n--- lectures/when-the-score-stops-moving.md", "b": "## Put another judge in the same loop\n\n**Take-home: put any judge in a loop that improves the thing it scores.**\n\nAny judge you own becomes infrastructure the moment you stop editing it and start improving what it scores.\n\nAsk the agent to set up the loop around a different judge:\n\n{{prompt:eval-loop-6}}\n\nConvergence was the floor in Module 5. Eval-as-yardstick is the ceiling here.\n\n--- end exercises/eval-loop.md\n\n\n--- lectures/when-the-score-stops-moving.md"}, {"id": "unsure-cc-getting-going-2", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agents-101/getting-going.md", "ask": "The same slide with and without one concrete sentence (an example, number, file or command). Is losing it damage? Pick the version for the room.", "before": "", "after": "", "a": "## Prework\n\nSet up your agent runtime. Build a snake game as HTML. Read [What is an Agent, LLM vs chat](trainings/agents-101/supplementary/what-is-an-agent.md#llm-vs-chat).", "b": "## Prework\n\nSet up your agent runtime. Build a snake game as HTML. Connect your calendar (M365 / Google Workspace / screenshot fallback) and save a 5-line summary of this week's meetings. Read [What is an Agent, LLM vs chat](trainings/agents-101/supplementary/what-is-an-agent.md#llm-vs-chat)."}, {"id": "unsure-cc-output-quality-3", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agents-101/output-quality.md", "ask": "The same slide with and without one concrete sentence (an example, number, file or command). Is losing it damage? Pick the version for the room.", "before": "", "after": "", "a": "## What You'll Learn\nAfter this module, you will be able to:\n\n- **Build** a reusable judge file from the winning method that names what it catches and where it stops\n- **Identify** what a judge can reach and what it can't, narrow and working beats broad and pretending", "b": "## What You'll Learn\nAfter this module, you will be able to:\n- **Test** detection methods on a 30-claim benchmark and pick the winner\n- **Build** a reusable judge file from the winning method that names what it catches and where it stops\n- **Identify** what a judge can reach and what it can't, narrow and working beats broad and pretending"}, {"id": "unsure-cc-output-quality-4", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agents-101/output-quality.md", "ask": "The same slide with and without one concrete sentence (an example, number, file or command). Is losing it damage? Pick the version for the room.", "before": "", "after": "", "a": "## Start here\n\nStart a fresh session or task at `~/Documents/agents-101/`.\n\nIn Module 3 the synthesized answer sat at an uneasy distance: you'd stake your reputation on some of it without knowing which. Your Module 4 residuals stay named, not solved; that is a different axis.\n\nThis module is the rescue. Not full closure: your Module 3 doubt and your Module 4 residuals stay where they are. One shape of output, measured, with the limits the judge can't reach named on its face. Module 6 turns the benchmark you build here into a check that runs on every build.\n\nModule 3 named text as the place where action starts. This module measures what the system actually says inside its scope. Four detectors run on the same claim pool, a scorer adjudicates 30 claims against the sources, and you walk out with the first judge you can defend.\n\n[Lecture: Grounded, and four candidates to measure](lectures/grounded.md)\n\n[Exercise: Hallucination benchmark](exercises/hallucination-bakeoff.md)", "b": "## Start here\n\nStart a fresh session or task at `~/Documents/agents-101/`.\n\nIn Module 3 the synthesized answer sat at an uneasy distance: you'd stake your reputation on some of it without knowing which. Your Module 4 residuals stay named, not solved; that is a different axis.\n\nThis module is the rescue. Not full closure: your Module 3 doubt and your Module 4 residuals stay where they are. One shape of output, measured, with the limits the judge can't reach named on its face. Module 6 turns the benchmark you build here into a check that runs on every build.\n\nModule 3 named text as the place where action starts. This module measures what the system actually says inside its scope. \n\n[Lecture: Grounded, and four candidates to measure](lectures/grounded.md)\n\n[Exercise: Hallucination benchmark](exercises/hallucination-bakeoff.md)"}, {"id": "unsure-cc-security-8", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agents-101/security.md", "ask": "The same slide with and without one concrete sentence (an example, number, file or command). Is losing it damage? Pick the version for the room.", "before": "", "after": "", "a": "## Bring to Module 5\n\n**One sentence per case: \"the missing organisational check was X.\"** Both cases are named in the pre-reads that follow. Module 5 opens on what a check would have caught, and the sentence is what you check it against.\n\nCome to Module 5 without the two missing-check sentences and you'll be reconstructing them while the benchmark is already comparing detectors. Your call.", "b": "## Bring to Module 5\n\n Module 5 opens on what a check would have caught, and the sentence is what you check it against.\n\nCome to Module 5 without the two missing-check sentences and you'll be reconstructing them while the benchmark is already comparing detectors. Your call."}, {"id": "unsure-cc-security-9", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agents-101/security.md", "ask": "The same slide with and without one concrete sentence (an example, number, file or command). Is losing it damage? Pick the version for the room.", "before": "", "after": "", "a": "## Pre-reads before Module 5\n\nRead Mata v. Carry the risk discipline from this module into both cases: what check was missing around the agent's output?\n\n[The Missing Check](lectures/module-5-prework.md)\n\nOnce the two sentences are saved, end this module's session or task. Module 5 starts fresh at `~/Documents/agents-101/`.", "b": "## Pre-reads before Module 5\n\nRead Mata v. Avianca (S.D.N.Y. 2023) and the Deloitte Australia / DEWR welfare-compliance report (2025), both in the lecture that follows. Carry the risk discipline from this module into both cases: what check was missing around the agent's output?\n\n[The Missing Check](lectures/module-5-prework.md)\n\nOnce the two sentences are saved, end this module's session or task. Module 5 starts fresh at `~/Documents/agents-101/`."}, {"id": "unsure-cc-evaluations-7", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agents-101/evaluations.md", "ask": "The same slide with and without one concrete sentence (an example, number, file or command). Is losing it damage? Pick the version for the room.", "before": "", "after": "", "a": "## Push back on the summary\n\nRead the agent's summary. Push back where it's wrong. *\"That rule is too vague, make it observable\"* / *\"you added a rule the tactic already had after round 2.\"* The artifact: the sharpened `./generation-tactic.md` plus one line added to the Module 6 eval-notes file naming the first always-on eval you'll run when work resumes. This is the module's thesis made literal. The work got sharper across rounds because the same judge kept catching the same kinds of misses and the tactic kept absorbing them.\n\nThis is the agent auditing a tactic it helped sharpen. That is acceptable here because the round files and judge notes are the evidence. If the summary sounds too kind, ask the sharper follow-up: *\"Which rule did you claim to remove but actually kept under another name? Quote both lines.\"*", "b": "## Push back on the summary\n\nRead the agent's summary. Push back where it's wrong. This is the module's thesis made literal. The work got sharper across rounds because the same judge kept catching the same kinds of misses and the tactic kept absorbing them.\n\nThis is the agent auditing a tactic it helped sharpen. That is acceptable here because the round files and judge notes are the evidence. If the summary sounds too kind, ask the sharper follow-up: *\"Which rule did you claim to remove but actually kept under another name? Quote both lines.\"*"}, {"id": "unsure-cc-building-agent-systems-4", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agents-101/building-agent-systems.md", "ask": "The same slide with and without one concrete sentence (an example, number, file or command). Is losing it damage? Pick the version for the room.", "before": "", "after": "", "a": "## Start here\nStart a fresh session or task at `~/Documents/agents-101/`. The fresh start keeps Module 1's personal-site scrollback out of the way.\n\nModule 2 turns to your real challenge. The empty `memory/`, `sources/`, and `agents/` folders are already there from prework, ready to fill. Your Module 1 generation-rules file stays scoped to `module-1/`; neither it nor `module-1/site.html` is an input to this build. The wider root instructions file doesn't exist yet. You'll write your first version at the end of this module (Debrief), grounded in what actually happens during the exercise.\n\nA site, a voice sharpened, fabrication caught by the only person in the room who could catch it. Now the training turns to work. The rest of it builds on the challenge you actually get paid to move, because that's where the system has to stand up.\n\nKarpathy's LLM Wiki post was in the prework. What's the difference between asking an LLM a question and having an LLM maintain a knowledge base for you?", "b": "## Start here\nStart a fresh session or task at `~/Documents/agents-101/`. The fresh start keeps Module 1's personal-site scrollback out of the way.\n\nModule 2 turns to your real challenge. Your Module 1 generation-rules file stays scoped to `module-1/`; neither it nor `module-1/site.html` is an input to this build. The wider root instructions file doesn't exist yet. You'll write your first version at the end of this module (Debrief), grounded in what actually happens during the exercise.\n\nA site, a voice sharpened, fabrication caught by the only person in the room who could catch it. Now the training turns to work. The rest of it builds on the challenge you actually get paid to move, because that's where the system has to stand up.\n\nKarpathy's LLM Wiki post was in the prework. What's the difference between asking an LLM a question and having an LLM maintain a knowledge base for you?"}, {"id": "unsure-cc-personal-to-team-8", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agents-101/personal-to-team.md", "ask": "The same slide with and without one concrete sentence (an example, number, file or command). Is losing it damage? Pick the version for the room.", "before": "", "after": "", "a": "## Bring to Module 8\n\n**Run `module-7/monday.md`.** Test one assumption. Ask for one name. Talk to one person. Module 8 works from what happened when the sharing plan touched the real organisation, so it needs a plan that has touched one.\n\nCome to Module 8 without one tested assumption or named person and you'll be reconstructing the contact while the opening exercise is already using the evidence. Your call.\n\nOnce the evidence is written down, end this module's session or task. Module 8 starts fresh at `~/Documents/agents-101/`.", "b": "## Bring to Module 8\n\n Ask for one name. Talk to one person. Module 8 works from what happened when the sharing plan touched the real organisation, so it needs a plan that has touched one.\n\nCome to Module 8 without one tested assumption or named person and you'll be reconstructing the contact while the opening exercise is already using the evidence. Your call.\n\nOnce the evidence is written down, end this module's session or task. Module 8 starts fresh at `~/Documents/agents-101/`."}, {"id": "unsure-ad58dca3-2", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "lectures/the-gate-is-a-claim.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Gates decay\n\n- A measure that becomes a target stops measuring. **Goodhart's law**, and the agent is an optimizer aimed straight at your gate. Tests get special-cased, judge prompts get keyword-stuffed, asserts get edited into agreement. No malice needed: optimization pressure finds the cheapest path to green.\n- Passing while missing the intent is a signature, not bad luck. When work clears the gate and still is not what you meant, the gate has decayed into a target. That is a reason to refresh the gate, not to shrug.\n- The countermoves are a hold-out and an integrity check. Keep a check the agent never sees, so nothing can optimize against it. After a suspicious pass, inspect the gate itself (the test file, the judge prompt, the asserts), not only its verdict.", "b": "## Gates decay\n\n- A measure that becomes a target stops measuring. **Goodhart's law.** The LLM is an optimizer aimed straight at your gate: it may special-case tests, keyword-stuff work for the judge, or edit assertions until they pass. No malice needed: optimization pressure finds the cheapest path to green.\n- Passing while missing the intent is a signature, not bad luck. When work clears the gate and still is not what you meant, the gate has decayed into a target. That is a reason to refresh the gate, not to shrug.\n- The countermoves are a hold-out and an integrity check. Keep a check the agent never sees, so nothing can optimize against it. After a suspicious pass, inspect the gate itself (the test file, the judge prompt, the asserts), not only its verdict."}, {"id": "unsure-488cf42a-10", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "exercises/diagnose-and-resend.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Pin each failure to a quoted moment\n\n- Push back where Claude generalises. Ground each lens in a quoted moment; the same moment may carry more than one lens. The diagnosis is data, not blame; the un-packaged run was supposed to underdeliver.\n- The move you just ran is *diagnosis through named failure modes*. The vocabulary is the lens; the artefact is the substance.", "b": "## Pin each failure to a quoted moment\n\n- Push back where Claude generalises. One quoted line per lens beats a paragraph of summary. The diagnosis is data, not blame; the un-packaged run was supposed to underdeliver.\n- The move you just ran is *diagnosis through named failure modes*. The vocabulary is the lens; the artefact is the substance."}, {"id": "unsure-488cf42a-12", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "trainings/agentic-engineering-101/learn-from-the-test.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## What You'll Learn\nAfter this module, you will be able to:\n- **Diagnose** your un-packaged send-off through three named lenses, goal drift, context rot, plausible-but-wrong, with quoted moments per lens\n- **Pair** each failure mode with the packaging that catches it: drift ↔ reference artefact, rot ↔ plan.md, plausible-but-wrong ↔ external verifier\n- **Build** a verifier shaped against your dominant failure using one of three shapes (background-agent, shell-hook, or Ralph re-feed)\n- **Assemble** the reference artefact + plan.md in conversation, scoped to the same task you sent off\n- **Re-send** the packaged version of the same task in the session your diagnosis ran in, and let it run a second time", "b": "## What You'll Learn\nAfter this module, you will be able to:\n- **Diagnose** your un-packaged send-off through three named lenses, goal drift, context rot, plausible-but-wrong, grounded in quoted moments from the run\n- **Pair** each failure mode with the packaging that catches it: drift ↔ reference artefact, rot ↔ plan.md, plausible-but-wrong ↔ external verifier\n- **Build** a verifier shaped against your dominant failure using one of three shapes (background-agent, shell-hook, or Ralph re-feed)\n- **Assemble** the reference artefact + plan.md in conversation, scoped to the same task you sent off\n- **Re-send** the packaged version of the same task in the session your diagnosis ran in, and let it run a second time"}, {"id": "unsure-bac0e2cd-16", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "lectures/what-keeps-a-long-running-session-going.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## A boundary decides whether to continue\n\n- Some boundaries already stand without you: tests, types, lint, permission limits, and explicit stop or ask conditions. Each can interrupt a wrong step before the next step builds on it.\n- The question is not how many checks the repo has. It is what notices first when this particular session goes wrong.\n- Do not add packaging mid-experiment. Watch where an existing boundary fires, where the session waits for you, and where nothing pushes back. That is part of the result you bring back.", "b": "## A boundary decides whether to continue\n\n- Some boundaries already stand without you: tests, types, lint, permission limits, and explicit stop or ask conditions. Each can catch a problem and send the work back for correction before later steps build on it.\n- The question is not how many checks the repo has. It is what notices first when this particular session goes wrong.\n- Do not add packaging mid-experiment. Watch where an existing boundary fires, where the session waits for you, and where nothing pushes back. That is part of the result you bring back."}, {"id": "unsure-a90c9ec2-58", "kind": "pair", "group": "Judge unsure: which version goes in front of the room", "where": "lectures/ironies-of-automation.md", "ask": "Two versions of the same section. The judge cannot call this one. Which is better?", "before": "", "after": "", "a": "## Earned trust breeds the miss\n\n- Earned trust is exactly what breeds the miss. Watch a system that is highly but imperfectly reliable, and your own detection performance degrades. The automation-studies literature named this **overreliance**: trusting the machine past the point where you still catch its errors (Parasuraman and Riley's use, misuse, disuse).\n- The more runs the agent lands cleanly, the worse you get at catching the one that doesn't. Each clean run is real evidence of competence and real erosion of your vigilance, at the same time. A longer leash quietly makes a worse watcher.\n- Trust and vigilance move in opposite directions. The same observed competence that earns the agent a longer leash degrades the attention you bring to the next run. The trust is deserved. The watching still has to be engineered. So when the next run lands clean, ask the plain question first: when did you last do this kind of work by hand?", "b": "## Earned trust breeds the miss\n\n- Earned trust is exactly what breeds the miss. Watch a system that is highly but imperfectly reliable, and your own detection performance degrades. The automation-studies literature named this **overreliance**: trusting the machine past the point where you still catch its errors (Parasuraman and Riley's use, misuse, disuse).\n- The more runs the agent lands cleanly, the worse you get at catching the one that doesn't. Each clean run is real evidence of competence and real erosion of your vigilance, at the same time. The more autonomy the agent earns, the worse a watcher you quietly become.\n- Trust and vigilance move in opposite directions. The same observed competence that earns t
