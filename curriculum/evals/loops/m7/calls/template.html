<title>Agents 101 Calls</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* One card per screen. The changed span leads; the full slide folds behind a toggle. */
:root {
  --bg: #f3f4f6; --sheet: #ffffff; --ink: #1d2430; --muted: #5d6675; --line: #d9dde3;
  --accent: #2f5d8a; --accent-soft: #e4edf6; --done: #2e7d4f; --done-soft: #e3f2e8; --slide: #fafbfc;
  --del: #fbe3e3; --del-line: #b04a4a;
  --f-read: "Newsreader", Georgia, serif; --f-ui: "IBM Plex Sans", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161c; --sheet: #1a2028; --ink: #e6e9ee; --muted: #9aa3b1; --line: #2c3440;
  --accent: #8db6e0; --accent-soft: #1f2d3c; --done: #7cc79a; --done-soft: #1b2d23; --slide: #161b22;
  --del: #3a2224; --del-line: #e08b8b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161c; --sheet: #1a2028; --ink: #e6e9ee; --muted: #9aa3b1; --line: #2c3440;
  --accent: #8db6e0; --accent-soft: #1f2d3c; --done: #7cc79a; --done-soft: #1b2d23; --slide: #161b22;
  --del: #3a2224; --del-line: #e08b8b; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
h1 { font-family: var(--f-read); font-weight: 600; font-size: 1.7rem; margin: 0; }
.lede { color: var(--muted); margin: 0; }
.progress { display: flex; align-items: center; gap: 10px; font: 0.85rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--done); }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.head { font-size: 0.85rem; color: var(--muted); }
.head b { color: var(--accent); font-weight: 600; }
.decision { margin: 0; font-family: var(--f-read); font-size: 1.25rem; font-weight: 600; }
.side { display: grid; gap: 4px; }
.label { font: 600 0.75rem var(--f-ui); color: var(--muted); letter-spacing: 0.06em; }
.span { background: var(--slide); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-family: var(--f-read); font-size: 1.08rem; line-height: 1.55; overflow-wrap: anywhere; }
.span .ctx { color: var(--muted); }
.span.empty { color: var(--muted); font-style: italic; }
mark { background: var(--accent-soft); color: inherit; border-bottom: 2px solid var(--accent); padding: 0 1px; }
.slide { background: var(--slide); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-family: var(--f-read); font-size: 0.98rem; margin-top: 6px; overflow-wrap: anywhere; }
.slide h3 { font-size: 1.05rem; margin: 0 0 6px; } .slide p { margin: 0 0 8px; } .slide p:last-child { margin: 0; }
code { font-family: var(--f-mono); font-size: 0.85em; }
details summary { cursor: pointer; font-size: 0.85rem; color: var(--muted); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { font: 600 1rem var(--f-ui); border: 1px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: 8px; padding: 12px 8px; cursor: pointer; }
.key kbd { font: 0.75rem var(--f-mono); color: var(--muted); margin-right: 6px; }
.key[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.key:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { width: 100%; box-sizing: border-box; min-height: 44px; font: 0.95rem var(--f-ui); color: var(--ink); background: var(--slide); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
.link { background: none; border: 0; color: var(--accent); font: 500 0.85rem var(--f-ui); cursor: pointer; padding: 0; }
.done { text-align: center; padding: 28px 18px; }
.done p { margin: 6px 0; }
.note { font-size: 0.85rem; color: var(--muted); }
.fold { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.fold summary { font-size: 0.9rem; color: var(--ink); font-weight: 500; }
.mini { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 6px; font-size: 0.88rem; }
.mini:first-of-type { border-top: 0; }
.mini .who { color: var(--muted); }
.mini .ans { color: var(--done); font-weight: 600; }
</style>

<div class="wrap">
  <header style="display:grid;gap:6px">
    <h1>Agents 101 calls</h1>
    <p class="lede">Only the calls the judge cannot make, one at a time. Press 1, 2 or 3. A one-line why is optional.</p>
  </header>
  <div class="progress"><span id="prog"></span><div class="meter"><i id="bar" style="width:0"></i></div></div>
  <div id="stage"></div>
  <p class="note" id="decided"></p>
  <p class="note" id="dbnote" hidden></p>
  <details class="fold" id="answered"><summary></summary><div></div></details>
  <details class="fold" id="backlog"><summary></summary><p class="note">Nothing here needs you. These stay open in case you want them; the threads take defaults.</p><div></div></details>
</div>

<script id="cards-data" type="application/json">__CARDS__</script>
<script id="queue-data" type="application/json">__QUEUE__</script>
<script>
const CARDS = JSON.parse(document.getElementById('cards-data').textContent);
const Q = JSON.parse(document.getElementById('queue-data').textContent);
const byId = Object.fromEntries(CARDS.map((c) => [c.id, c]));
const QUEUE = Q.queue.filter((q) => byId[q.id]);
const inQueue = new Set(QUEUE.map((q) => q.id));
const answers = {};
let db = null, cur = null, showFull = false;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const answered = (id) => answers[id] && (answers[id].choice || answers[id].steer);
function inline(t) {
  return esc(t).replace(/&lt;!--[\s\S]*?--&gt;/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '<em>$1</em>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/⟦/g, '<mark>').replace(/⟧/g, '</mark>').replace(/<\/mark>(\s*)<mark>/g, '$1');
}
function md(text) {
  return (text || '').split(/\n{2,}/).map((b) => { const t = b.trim(); if (!t) return '';
    return /^#{1,3} /.test(t) ? `<h3>${inline(t.replace(/^#{1,3} /, ''))}</h3>` : `<p>${inline(t).replace(/\n/g, '<br>')}</p>`; }).join('');
}
function diffMark(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  if (A.length * B.length > 4e6) return [a, b];
  const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, ra = '', rb = '';
  const wrap = (t) => (/^\s+$/.test(t) ? t : `⟦${t}⟧`);
  while (i < n && j < m) {
    if (A[i] === B[j]) { ra += A[i]; rb += B[j]; i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) ra += wrap(A[i++]); else rb += wrap(B[j++]);
  }
  while (i < n) ra += wrap(A[i++]); while (j < m) rb += wrap(B[j++]);
  return [ra, rb];
}
// The changed sentences plus one sentence of context on each side; the rest collapses to an ellipsis.
function excerpt(marked) {
  const body = marked.replace(/^#{1,3} [^\n]*\n+/, '');
  const sents = body.replace(/\n+/g, ' ').split(/(?<=[.!?:*"”)])\s+(?=[A-Z*"“(\[`-])/);
  const hit = sents.map((s) => s.includes('⟦'));
  if (!hit.some(Boolean)) return '<span class="ctx">(no wording change in this version)</span>';
  const keep = hit.map((h, k) => h || hit[k - 1] || hit[k + 1]);
  let out = '', gap = false;
  sents.forEach((s, k) => {
    if (!keep[k]) { gap = true; return; }
    if (gap && out) out += ' <span class="ctx">…</span> ';
    gap = false;
    out += hit[k] ? inline(s) + ' ' : `<span class="ctx">${inline(s)}</span> `;
  });
  return (keep[0] ? '' : '<span class="ctx">… </span>') + out.trim() + (keep[keep.length - 1] ? '' : ' <span class="ctx">…</span>');
}
function head(c) {
  const t = /agents-101|personal-to-team|monday|module-7/.test(c.where + c.id) ? 'Agents 101' : /unsure-[0-9a-f]{8}/.test(c.id) ? 'AE101 history' : 'Agents 101';
  return `<b>${esc(t)}</b> · ${esc(c.where.replace(/\.md\b/g, ''))}`;
}

function renderCard() {
  const open = QUEUE.filter((q) => !answered(q.id));
  const done = QUEUE.length - open.length;
  document.getElementById('prog').textContent = `${done} of ${QUEUE.length}`;
  document.getElementById('bar').style.width = QUEUE.length ? `${(100 * done) / QUEUE.length}%` : '100%';
  const stage = document.getElementById('stage');
  if (cur && answered(cur) && !stage.dataset.hold) cur = null;
  if (!cur || !inQueue.has(cur)) cur = open[0] ? open[0].id : null;
  if (!cur) { stage.innerHTML = `<div class="card done"><p><strong>Queue clear.</strong></p><p class="note">New calls arrive here only when the judge cannot make them.</p></div>`; return; }
  const q = QUEUE.find((x) => x.id === cur), c = byId[cur], a = answers[cur] || {};
  const [ma, mb] = c.a && c.b ? diffMark(c.a, c.b) : [c.a || '', c.b || ''];
  const side = (lbl, marked, raw) => `<div class="side"><span class="label">${lbl}</span>${raw ? `<div class="span">${excerpt(marked)}</div>` : '<div class="span empty">No slide here in this version.</div>'}
      ${showFull && raw ? `<div class="slide">${md(marked)}</div>` : ''}</div>`;
  stage.innerHTML = `<article class="card">
    <div class="head">${head(c)}</div>
    <p class="decision">${esc(q.decision || c.ask)}</p>
    ${side('A', ma, c.a)}${side('B', mb, c.b)}
    <div class="row"><button class="link" id="full">${showFull ? 'Hide full slides' : 'Show full slides'}</button></div>
    <div class="keys">${['A', 'B', 'Neither'].map((o, i) => `<button class="key" data-o="${o}" aria-pressed="${a.choice === o}"><kbd>${i + 1}</kbd>${o}</button>`).join('')}</div>
    <textarea id="why" placeholder="Why, in one line (optional). Type it before pressing a key.">${esc(a.steer || '')}</textarea>
    <div class="row"><span id="st">${a.at ? 'Saved' : ''}</span>${open.length > 1 ? '<button class="link" id="skip">Skip for now</button>' : ''}</div>
  </article>`;
}
function renderFolds() {
  const ans = CARDS.filter((c) => answered(c.id));
  const backlog = CARDS.filter((c) => !answered(c.id) && !inQueue.has(c.id));
  const mini = (c) => `<div class="mini"><span class="who">${esc(c.group)} · ${esc(c.where)}</span>${answered(c.id) ? `<span class="ans">${esc(answers[c.id].choice || 'Steer')}${answers[c.id].steer ? ': ' + esc(answers[c.id].steer) : ''}</span>` : `<span>${esc(c.ask)}</span>`}</div>`;
  const A = document.getElementById('answered'), B = document.getElementById('backlog');
  A.querySelector('summary').textContent = `Answered (${ans.length})`; A.querySelector('div').innerHTML = ans.map(mini).join('');
  B.querySelector('summary').textContent = `Backlog (${backlog.length}), not needed`; B.querySelector('div').innerHTML = backlog.map(mini).join('');
  document.getElementById('decided').textContent = Q.decided_note || '';
}
function render() { renderCard(); renderFolds(); }

async function save(choice) {
  if (!cur) return;
  const id = cur, doc = { choice, conf: '', steer: (document.getElementById('why') || {}).value?.trim() || '', at: new Date().toISOString() };
  answers[id] = doc;
  try { localStorage.setItem('calls-' + id, JSON.stringify(doc)); } catch (_) {}
  cur = null; showFull = false; render();
  if (!db) { document.getElementById('dbnote').hidden = false; document.getElementById('dbnote').textContent = 'Answers are kept in this browser only; the shared record is not reachable in this view.'; return; }
  try { await db.doc('calls/' + id).set(doc); }
  catch (err) { const n = document.getElementById('dbnote'); n.hidden = false; n.textContent = `Could not save ${id}: ${(err && err.message) || err}. It is kept in this browser.`; }
}
document.getElementById('stage').addEventListener('click', (e) => {
  const k = e.target.closest('.key'); if (k) return save(k.dataset.o);
  if (e.target.id === 'full') { showFull = !showFull; renderCard(); }
  if (e.target.id === 'skip') { const open = QUEUE.filter((q) => !answered(q.id)); const i = open.findIndex((q) => q.id === cur); cur = open[(i + 1) % open.length].id; showFull = false; renderCard(); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' && !(e.metaKey || e.ctrlKey)) return;
  const o = { 1: 'A', 2: 'B', 3: 'Neither' }[e.key]; if (o) { e.preventDefault(); save(o); }
});

for (const c of CARDS) { try { const v = localStorage.getItem('calls-' + c.id); if (v) answers[c.id] = JSON.parse(v); } catch (_) {} }
render();
(async () => {
  const note = document.getElementById('dbnote');
  db = window.claude ? await window.claude.use('db') : null;
  if (!db) { note.hidden = false; note.textContent = 'The shared record is not reachable in this view, so answers stay in this browser. Open the page signed in on claude.ai to save them.'; return; }
  const timer = setTimeout(() => { note.hidden = false; note.textContent = 'Still loading saved answers…'; }, 10000);
  db.collection('calls').onSnapshot((snap) => {
    clearTimeout(timer); note.hidden = true;
    for (const d of snap.docs) answers[d.id] = d.data();
    render();
  }, () => { clearTimeout(timer); note.hidden = false; note.textContent = 'Saved answers could not be loaded. New saves may still work.'; });
})();
</script>
